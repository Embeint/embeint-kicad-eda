/*
 * Commands and responses related to manipulating editor windows
 */

syntax = "proto3";

package kiapi.common.commands;

import "google/protobuf/any.proto";
import "common/types/base_types.proto";
import "common/types/enums.proto";
import "common/types/embedded_files.proto";

// Refreshes the given frame, if that frame is open
message RefreshEditor
{
  kiapi.common.types.FrameType frame = 1;
}

// Opens a specific item from a library by identifier
message OpenLibraryItem
{
  kiapi.common.types.DocumentType type = 1;
  kiapi.common.types.LibraryIdentifier identifier = 2;
}

// Retrieves a list of open documents of the given type
message GetOpenDocuments
{
  // Which type of documents to query
  kiapi.common.types.DocumentType type = 1;
}

message GetOpenDocumentsResponse
{
  repeated kiapi.common.types.DocumentSpecifier documents = 1;
}

enum DocumentModifiedState
{
  DMS_UNKNOWN    = 0;
  DMS_UNMODIFIED = 1;
  DMS_MODIFIED   = 2;
}

// Checks whether a document currently open in an editor or headless context has unsaved changes
message GetDocumentModifiedState
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message GetDocumentModifiedStateResponse
{
  DocumentModifiedState state = 1;
}

// Saves the given document (and its project) to a new location and switches to the new project.
// Only available in headless mode; in GUI mode a project change may require closing other editor
// frames, which the API is not allowed to do.
// Since: 11.0
message SaveDocumentAs
{
  kiapi.common.types.DocumentSpecifier document = 1;

  string path = 2;
}

message SaveOptions
{
  // Overwrite destination file(s) if they exist
  bool overwrite = 1;

  // If the file being saved normally requires a project (for example, a board or schematic),
  // this flag will cause a new project to be saved alongside the new file
  bool include_project = 2;
}

// Saves the given document to a new location and does not open the new copy
message SaveCopyOfDocument
{
  kiapi.common.types.DocumentSpecifier document = 1;

  string path = 2;

  SaveOptions options = 3;
}

message RevertDocument
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

/*
 * Runs a TOOL_ACTION using the TOOL_MANAGER of a given frame.
 * WARNING: The TOOL_ACTIONs are specifically *not* an API.
 * Command names may change as code is refactored, and commands may disappear.
 * This API method is provided for low-level prototyping purposes only.
 */
message RunAction
{
  string action = 1;  // Action name, like "eeschema.InteractiveSelection.ClearSelection"
}

enum RunActionStatus
{
  RAS_UNKNOWN        = 0;
  RAS_OK             = 1;  // The action was submitted successfully.
  RAS_INVALID        = 2;  // The action was unknown for the targeted frame.
  RAS_FRAME_NOT_OPEN = 3;  // The targeted frame was not open when the call was submitted.
}

/*
 * NOTE: At the moment, RAS_FRAME_NOT_OPEN won't be returned as the handler is inside the frame.
 */
message RunActionResponse
{
  RunActionStatus status = 1;
}


/*
 * Begins a staged set of changes.  Any modifications made to a document through the API after this
 * call will be saved to a pending commit, and will not appear in KiCad until a matching call to
 * END_COMMIT.
 */
message BeginCommit
{
  // Specifies which document to associate the commit with
  kiapi.common.types.ItemHeader header = 1;

  // Embeint extension: seconds the commit may stay without a request from its client before the
  // editor rolls it back (for a client that was killed or disconnected).  0 means the default of
  // 60 seconds; at most 3600.
  uint32 lease_seconds = 100;
}


message BeginCommitResponse
{
  // Opaque identifier tracking a commit
  kiapi.common.types.KIID id = 1;
}


enum CommitAction
{
  CMA_UNKNOWN = 0;
  CMA_COMMIT  = 1; // Commit the changes to the design
  CMA_DROP    = 2; // Cancel this commit
}


message EndCommit
{
  // The ID that was given by BeginCommit
  kiapi.common.types.KIID id = 1;

  // What to do with this commit
  CommitAction action = 2;

  // Optional message describing this changeset
  string message = 3;

  // Specifies which document to associate the commit with
  kiapi.common.types.ItemHeader header = 4;
}


message EndCommitResponse
{
}

// Creates new items on a given document
message CreateItems
{
  // Specifies which document to create on, which fields are included, etc.
  kiapi.common.types.ItemHeader header = 1;

  // List of items to create
  repeated google.protobuf.Any items = 2;

  // Items may be created on a top-level document (sheet, board, etc) or inside a container
  // (symbol, footprint).  If this field is not empty, it holds the ID of a symbol or footprint
  // that the items should be added to.  This ID must be an existing symbol (for schematic
  // documents) or footprint (for board documents).  If the given container does not exist or is
  // not the correct item type, the CreateItems call will fail.
  kiapi.common.types.KIID container = 3;
}

enum ItemStatusCode
{
  ISC_UNKNOWN      = 0;
  ISC_OK           = 1; // The item was created or updated
  ISC_INVALID_TYPE = 2; // The item's type is not valid for the given document
  ISC_EXISTING     = 3; // The item to be created had a specified KIID and that KIID was already in use
  ISC_NONEXISTENT  = 4; // The item to be updated did not exist in the given document
  ISC_IMMUTABLE    = 5; // The item to be updated is not allowed to be modified by the API
  ISC_INVALID_DATA = 7; // The item to be created does not have valid data for the given document
}

// Per-item status feedback for creation and update calls
message ItemStatus
{
  ItemStatusCode code = 1;

  string error_message = 2;
}

message ItemCreationResult
{
  ItemStatus status = 1;

  // The created version of the item, including an updated KIID as applicable
  google.protobuf.Any item = 2;
}

message CreateItemsResponse
{
  // Specifies which document was modified, which fields are included in created_items, etc.
  kiapi.common.types.ItemHeader header = 1;

  // Status of the overall request; may return IRS_OK even if no items were created
  kiapi.common.types.ItemRequestStatus status = 2;

  // Status of each item to be created
  repeated ItemCreationResult created_items = 3;
}

message GetItems
{
  // Specifies which document to query, which fields to return, etc.
  kiapi.common.types.ItemHeader header = 1;

  // List of types of items to retrieve; if omitted, all types valid for the
  // target document will be returned
  repeated kiapi.common.types.KiCadObjectType types = 2;
}

message GetItemsById
{
  // Specifies which document to query, which fields to return, etc.
  kiapi.common.types.ItemHeader header = 1;

  repeated kiapi.common.types.KIID items = 2;
}

message GetItemsResponse
{
  // Specifies which document was modified, which fields are included in items, etc.
  kiapi.common.types.ItemHeader header = 1;

  // Status of the overall request; may return IRS_OK even if no items were retrieved
  kiapi.common.types.ItemRequestStatus status = 2;

  repeated google.protobuf.Any items = 3;
}

// Updates items in a given document
message UpdateItems
{
  // Specifies which document to modify, which fields are included, etc.
  kiapi.common.types.ItemHeader header = 1;

  // List of items to modify
  repeated google.protobuf.Any items = 2;
}


message ItemUpdateResult
{
  ItemStatus status = 1;

  // The update version of the item
  google.protobuf.Any item = 2;
}

message UpdateItemsResponse
{
  // Specifies which document was modified, which fields are included in updated_items, etc.
  kiapi.common.types.ItemHeader header = 1;

  // Status of the overall request; may return IRS_OK even if no items were modified
  kiapi.common.types.ItemRequestStatus status = 2;

  // Status of each item to be created
  repeated ItemUpdateResult updated_items = 3;
}

// Deletes items in a given document
message DeleteItems
{
  // Specifies which document to modify
  kiapi.common.types.ItemHeader header = 1;

  // List of item KIIDs to delete
  repeated kiapi.common.types.KIID item_ids = 2;
}

enum ItemDeletionStatus
{
  IDS_UNKNOWN      = 0;
  IDS_OK           = 1;
  IDS_NONEXISTENT  = 2; // The item did not exist in the given document
  IDS_IMMUTABLE    = 3; // The item is not allowed to be modified by the API
}

message ItemDeletionResult
{
  kiapi.common.types.KIID id = 1;

  ItemDeletionStatus status = 2;
}

message DeleteItemsResponse
{
  // Specifies which document was modified, etc.
  kiapi.common.types.ItemHeader header = 1;

  // Status of the overall request; may return IRS_OK even if no items were deleted
  kiapi.common.types.ItemRequestStatus status = 2;

  // Status of each item requested to be deleted
  repeated ItemDeletionResult deleted_items = 3;
}

enum BoundingBoxMode
{
  BBM_UNKNOWN = 0;
  BBM_ITEM_ONLY = 1;
  BBM_ITEM_AND_CHILD_TEXT = 2;
}

message GetBoundingBox
{
  kiapi.common.types.ItemHeader header = 1;

  repeated kiapi.common.types.KIID items = 2;

  // Some item types can have independently-movable text as children (e.g. footprints)
  // This mode controls whether or not these are included in the box
  BoundingBoxMode mode = 3;
}

message GetBoundingBoxResponse
{
  repeated kiapi.common.types.KIID items = 1;

  repeated kiapi.common.types.Box2 boxes = 2;
}

// Retrieves a list of items.  Returns SelectionResponse
message GetSelection
{
  // Specifies which document to query for selected items.
  kiapi.common.types.ItemHeader header = 1;

  // An optional list of types to filter on.
  // If none are provided, all selected items will be returned.
  repeated kiapi.common.types.KiCadObjectType types = 2;
}

// The set of currently selected items
message SelectionResponse
{
  repeated google.protobuf.Any items = 1;
}

// Adds the given items to the selection.  Returns SelectionResponse
message AddToSelection
{
  kiapi.common.types.ItemHeader header = 1;

  // The items to select
  repeated kiapi.common.types.KIID items = 2;
}

// Removes the given items to the selection.  Returns SelectionResponse
message RemoveFromSelection
{
  kiapi.common.types.ItemHeader header = 1;

  // The items to deselect
  repeated kiapi.common.types.KIID items = 2;
}

// Removes all items from selection
message ClearSelection
{
  kiapi.common.types.ItemHeader header = 1;
}

// Ensures the given items are visible and zooms to fit them.
// The bounding box of all given items will be expanded by `margin` if present.
// Returns an error if any of the given `items` are not in `document`.
// Available only in interactive mode and when the editor in question is idle.
// Returns Empty
message FocusOnItems
{
  // For schematics, a document with a sheet path focuses that sheet's placement of the items
  kiapi.common.types.DocumentSpecifier document = 1;

  // The items to fit in the view.  Schematic items must all be on one sheet.
  repeated kiapi.common.types.KIID items = 2;

  optional kiapi.common.types.Distance margin = 3;
}

// Tests if a certain point falls within tolerance of an item's geometry
message HitTest
{
  kiapi.common.types.ItemHeader header = 1;

  kiapi.common.types.KIID id = 2;

  kiapi.common.types.Vector2 position = 3;

  int32 tolerance = 4;
}

enum HitTestResult
{
  HTR_UNKNOWN = 0;
  HTR_NO_HIT  = 1;
  HTR_HIT     = 2;
}

message HitTestResponse
{
  HitTestResult result = 1;
}

// returns common.types.TitleBlockInfo
message GetTitleBlockInfo
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message SetTitleBlockInfo
{
  kiapi.common.types.DocumentSpecifier document = 1;

  kiapi.common.types.TitleBlockInfo title_block = 2;
}

// returns common.types.PageSettings
message GetPageSettings
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message SetPageSettings
{
  kiapi.common.types.DocumentSpecifier document = 1;

  kiapi.common.types.PageSettings page_settings = 2;
}

message SaveDocumentToString
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message SavedDocumentResponse
{
  kiapi.common.types.DocumentSpecifier document = 1;

  string contents = 2;
}

message SaveSelectionToString
{
}

message SavedSelectionResponse
{
  repeated kiapi.common.types.KIID ids = 1;

  string contents = 2;
}

// Attempts to parse the given string as a s-expression formatted container with items,
// similar to how the Paste action inside the KiCad editor works.  If the parse is successful,
// the items will be created and inserted into the editor.
// Returns CreateItemsResponse
message ParseAndCreateItemsFromString
{
  kiapi.common.types.DocumentSpecifier document = 1;

  string contents = 2;
}

/*
 * Embedded files of an open document (a footprint or a library symbol)
 */

// Embeds a file KiCad can read from disk, compressing it as the editor does.  The type follows the
// extension (STEP/WRL models, PDF datasheets, fonts, worksheets).  Reference it as uri, e.g. as a
// footprint's 3D model filename.  Returns EmbedFileFromPathResponse
// Since: 11.0
message EmbedFileFromPath
{
  kiapi.common.types.DocumentSpecifier document = 1;
  string path = 2;
  // Replace an embedded file of the same name instead of refusing
  bool overwrite = 3;
}

message EmbeddedFileInfo
{
  string name = 1;
  kiapi.common.types.EmbeddedFileType type = 2;
  // A kicad-embed:// link to the file
  string uri = 3;
  // Size of the stored (compressed, encoded) data in bytes
  int64 stored_size = 4;
}

message EmbedFileFromPathResponse
{
  EmbeddedFileInfo file = 1;
}

// Returns EmbeddedFileListResponse
// Since: 11.0
message GetEmbeddedFileList
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message EmbeddedFileListResponse
{
  repeated EmbeddedFileInfo files = 1;
}

// Removes an embedded file by name.  Returns Empty
// Since: 11.0
message RemoveEmbeddedFile
{
  kiapi.common.types.DocumentSpecifier document = 1;
  string name = 2;
}

// Undoes the editor's most recent change.  Works in every editor (schematic, symbol, PCB and
// footprint).  Refused while an API commit is open.  Returns UndoRedoResponse
// Since: 11.0
message UndoLastChange
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

// Redoes the most recently undone change.  Returns UndoRedoResponse
// Since: 11.0
message RedoLastChange
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message UndoRedoResponse
{
  bool performed = 1;
  int32 undo_count = 2;
  int32 redo_count = 3;
}

// Reports the revision of an open document.  The editor advances the revision whenever the
// document's content changes: manual edits, API commits, changes staged in an open API commit,
// rollbacks, undo, redo and reloads.  Every reply to a request naming the document also carries
// it in ApiResponseHeader.document_revision.  Returns DocumentRevisionResponse
// Since: 11.0 (Embeint)
message GetDocumentRevision
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message DocumentRevisionResponse
{
  // Opaque token; compare for equality only.  It differs between editor windows and sessions.
  string revision = 1;

  // API commits open on this editor, from any client
  int32 open_commits = 2;

  // The document has unsaved changes
  bool modified = 3;
}

enum OperationState
{
  // Not in the editor's history: never received, still queued, or evicted (see history_capacity)
  OPS_UNKNOWN     = 0;

  // Part of an API commit that is still open
  OPS_IN_PROGRESS = 1;

  // Committed to the document (one undo step)
  OPS_COMMITTED   = 2;

  // Dropped by its client, rolled back on a revision conflict, or rolled back when its commit's
  // lease expired.  The document holds none of its changes.
  OPS_ROLLED_BACK = 3;

  // Refused before it changed anything (for example AS_REVISION_MISMATCH)
  OPS_REJECTED    = 4;

  // A request outside a commit returned an error after it may have changed the document; compare
  // revision_before and revision_after and inspect the document
  OPS_FAILED      = 5;
}

// Reports what happened to a mutation sent with ApiRequestHeader.operation_id.
// Returns OperationStatusResponse
// Since: 11.0 (Embeint)
message GetOperationStatus
{
  string operation_id = 1;
}

message OperationStatusResponse
{
  string operation_id = 1;

  OperationState state = 2;

  // The request type that started the operation, e.g. kiapi.common.commands.BeginCommit
  string request_type = 3;

  // The document the operation named, if any
  kiapi.common.types.DocumentSpecifier document = 4;

  // Document revision before the operation, and after it was committed or rolled back
  string revision_before = 5;
  string revision_after = 6;

  // Why the operation was rolled back, refused or failed
  string message = 7;

  string client_name = 8;

  // How many operations the process remembers; older ones report OPS_UNKNOWN
  int32 history_capacity = 9;
}

// Reports how a schematic sheet or a board sits on its page: the page size, the drawing area
// inside the drawing sheet's border, the title block, the extent of everything on the page
// (fields and text included) and each item that crosses the border or overlaps the title block.
// The drawing area and title block are measured from the document's own drawing sheet (default
// or custom), so the check follows A4, A3 or any other page size.  Returns PageLayoutResponse
// Since: 11.0
message GetPageLayout
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message PageLayoutItem
{
  kiapi.common.types.KIID id = 1;

  // Item type, e.g. "Symbol", "Wire", "Footprint", "Track", "Zone"
  string type = 2;

  // Reference, label, net or text, to identify the item in a report
  string name = 3;

  // Bounding box including visible fields and text
  kiapi.common.types.Box2 box = 4;

  // Part of the box lies outside the drawing area
  bool outside_drawing_area = 5;

  // The box intersects the title block
  bool overlaps_title_block = 6;

  // In overlaps only: which part of the item, a field name ("Reference", "Value") or
  // "Text: <text>" for a footprint's own text; empty for the item itself (a symbol or sheet body,
  // a label, text, a wire or a sheet pin)
  string part = 7;
}

// Two items whose drawn extents overlap.  Boxes come from the editor's own text extents.
message PageLayoutOverlap
{
  PageLayoutItem first = 1;

  PageLayoutItem second = 2;

  // The overlapping area (for a wire, where it crosses the text)
  kiapi.common.types.Box2 overlap = 3;

  // Boards only: the layer both texts are on
  string layer = 4;
}

message PageLayoutResponse
{
  kiapi.common.types.Vector2 page_size = 1;

  // Inside the drawing sheet's border (the innermost page-sized rectangle, else the margins)
  kiapi.common.types.Box2 drawing_area = 2;

  // Union of the drawing sheet items anchored to the bottom-right corner; empty if none
  kiapi.common.types.Box2 title_block = 3;

  // Union of every item's bounding box; empty for an empty page
  kiapi.common.types.Box2 content = 4;

  // Items that cross the drawing area or overlap the title block
  repeated PageLayoutItem problems = 5;

  // Number of items checked
  int32 item_count = 6;

  // Boards only: the bounding box of the board outline (Edge.Cuts); empty without an outline
  kiapi.common.types.Box2 board_outline = 7;

  // Overlapping pairs, independent of problems.  Schematics: visible fields, labels, sheet pins,
  // text, text boxes, symbol and sheet bodies and tables with each other, and wires or buses
  // crossing text.  An item's body is not compared with its own fields or pins.  Boards: visible
  // text and footprint fields on the same silkscreen or fabrication layer.  At most 200 pairs.
  repeated PageLayoutOverlap overlaps = 8;

  // Number of overlapping pairs found, including any beyond those listed
  int32 overlap_count = 9;

  // The editor ran the overlap check (false from builds without it)
  bool overlaps_checked = 10;
}

enum GridStyle
{
  GST_UNKNOWN     = 0;
  GST_DOTS        = 1;
  GST_LINES       = 2;
  GST_SMALL_CROSS = 3;
}

enum GridSnapping
{
  GSN_UNKNOWN   = 0;
  GSN_ALWAYS    = 1;  // snap to the grid whether or not it is shown
  GSN_WITH_GRID = 2;  // snap only while the grid is shown
  GSN_NEVER     = 3;
}

message GridPreset
{
  string name = 1;
  kiapi.common.types.Vector2 size = 2;
}

// The editor's drawing grid.  Returns GridSettings
// Since: 11.0
message GetGridSettings
{
  kiapi.common.types.DocumentSpecifier document = 1;
}

message GridSettings
{
  // The current grid
  kiapi.common.types.Vector2 size = 1;

  // Index of the current grid in presets
  int32 preset_index = 2;

  // The grids offered in the editor's grid list
  repeated GridPreset presets = 3;

  bool visible = 4;
  GridStyle style = 5;
  GridSnapping snapping = 6;

  // Where the grid starts (a board's grid origin, set with SetBoardOrigin; zero elsewhere)
  kiapi.common.types.Vector2 origin = 7;
}

// Changes the editor's drawing grid.  Fields left unset are kept.  Returns GridSettings
// Since: 11.0
message SetGridSettings
{
  kiapi.common.types.DocumentSpecifier document = 1;

  // Makes this the current grid: picks the preset of this size, adding one if there is none
  optional kiapi.common.types.Vector2 size = 2;

  // Makes the preset at this index the current grid (ignored when size is set)
  optional int32 preset_index = 3;

  optional bool visible = 4;
  optional GridStyle style = 5;
  optional GridSnapping snapping = 6;
}
