[package]
name = "kicad-clipper2-rectclip-shim"
description = "Native JSONL adapter for the Clipper2 rectangle clipping source port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.kicad]
portable = false

[dependencies]
kicad-clipper2 = { path = "../kicad-clipper2" }
kicad-difftest = { path = "../kicad-difftest" }
serde_json.workspace = true

[features]
live-wasm = []

[[example]]
name = "corpus_parity"
required-features = ["live-wasm"]
