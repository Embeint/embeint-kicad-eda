# SPDX-License-Identifier: GPL-3.0-or-later
#
# Embeint KiCad Rust workspace.  Portable crates (no filesystem, sockets, processes or GUI types)
# are shared by native tools and the WebAssembly build; see README.md.  embeint-ipc and
# embeint-mcp are native only (sockets, processes): the gate 4 MCP server, see MCP.md.

[workspace]
resolver = "2"
members = ["embeint-layout", "embeint-web", "embeint-layout-cli", "embeint-ipc", "embeint-mcp", "kicad-difftest", "kicad-md5", "kicad-md5-shim", "kicad-hash", "kicad-hash-shim", "kicad-iec60664", "kicad-iec60664-shim", "kicad-resistors", "kicad-resistors-shim", "kicad-math", "kicad-math-shim", "kicad-math-util-shim", "kicad-vector-shim", "kicad-geometry-shim", "kicad-util-box-shim", "kicad-eda-angle-shim", "kicad-arc-chord-shim", "kicad-rtree-node", "kicad-rtree-node-shim", "kicad-rtree", "kicad-rtree-shim", "kicad-rtree-cow-packed", "kicad-rtree-cow-packed-shim", "kicad-clipper2", "kicad-clipper2-shim", "kicad-core", "kicad-core-shim", "kicad-core-include-shim", "kicad-map-helpers", "kicad-map-helpers-shim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Embeint/embeint-kicad-eda"
publish = false

[workspace.dependencies]
embeint-layout = { path = "embeint-layout" }
embeint-ipc = { path = "embeint-ipc" }
solidcore = { path = "../.port-deps/solidcore/crates/solidcore", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order", "arbitrary_precision"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
