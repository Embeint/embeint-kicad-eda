[package]
name = "kicad-shape-line-chain-shim"
description = "Native JSONL adapter for the shape_line_chain.h, shape_index.h and shape_index_list.h inline body port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.kicad]
portable = false

[dependencies]
kicad-math = { path = "../kicad-math" }
kicad-rtree-cow-packed = { path = "../kicad-rtree-cow-packed" }
kicad-difftest = { path = "../kicad-difftest" }
serde_json.workspace = true

[features]
live-wasm = []

[[example]]
name = "corpus_parity"
required-features = ["live-wasm"]
