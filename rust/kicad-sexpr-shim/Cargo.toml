# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "kicad-sexpr-shim"
description = "Native JSONL adapter for the libs/sexpr header and source ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.kicad]
portable = false

[dependencies]
kicad-sexpr = { path = "../kicad-sexpr" }
kicad-difftest = { path = "../kicad-difftest" }
serde_json.workspace = true

[features]
# Replays the corpora and controls in wasm32 against native replies supplied at build time.
live-wasm = []

[[example]]
name = "corpus_parity"
required-features = ["live-wasm"]
