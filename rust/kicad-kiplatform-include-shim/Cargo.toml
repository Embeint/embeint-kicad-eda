[package]
name = "kicad-kiplatform-include-shim"
description = "Native JSONL adapter for the kiplatform public header port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.kicad]
portable = false

[dependencies]
kicad-kiplatform = { path = "../kicad-kiplatform" }
kicad-kiplatform-sysinfo = { path = "../kicad-kiplatform-sysinfo" }
kicad-map-helpers = { path = "../kicad-map-helpers" }
kicad-math = { path = "../kicad-math" }
kicad-difftest = { path = "../kicad-difftest" }
serde_json.workspace = true

[features]
# Replays the corpus in wasm32 against native C++ replies supplied at build time.
live-wasm = []

[[example]]
name = "corpus_parity"
required-features = ["live-wasm"]
