[package]
name = "kicad-core-include-shim"
description = "Native JSONL adapter for the libs/core/include/core header port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.kicad]
portable = false

[dependencies]
kicad-core = { path = "../kicad-core" }
kicad-core-shim = { path = "../kicad-core-shim" }
kicad-difftest = { path = "../kicad-difftest" }
serde_json.workspace = true

[features]
# Replays the corpus in wasm32 against native C++ replies supplied at build time.
live-wasm = []

[[example]]
name = "corpus_parity"
required-features = ["live-wasm"]
