# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "embeint-mcp"
description = "Native MCP server for Embeint KiCad: discovery, item edits, command execution and transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "embeint-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
embeint-ipc.workspace = true
embeint-layout.workspace = true
prost-reflect = "0.16"
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "io-std", "io-util", "sync", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
