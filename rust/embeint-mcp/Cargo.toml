# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "embeint-mcp"
description = "Native MCP server for Embeint KiCad: discovery, item edits, command execution and transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "embeint-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
# Local date for set_page date="today" (Python's datetime.date.today())
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
geo = { version = "0.32", default-features = false }
embeint-ipc.workspace = true
embeint-layout.workspace = true
prost-reflect = "0.16"
regex = { version = "1.11", default-features = false, features = ["std", "unicode"] }
# Held at 0.8.1: 0.8.2 and later need Rust 1.87, above the declared minimum of 1.85
ruzstd = "=0.8.1"
serde_json.workspace = true
sha2 = "0.10"
# The private preview directory of live_schematic_view (Python's tempfile.TemporaryDirectory)
tempfile = "3.20"
tokio = { version = "1", features = ["rt", "io-std", "io-util", "sync", "macros", "time", "process"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
yaml-rust2 = { version = "0.13.1", default-features = false }

[dev-dependencies]
prost = "0.14"
tokio = { version = "1", features = ["net"] }
