# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "kicad-poisson-shim"
description = "Native JSONL adapter for the POISSON_DISK::ToroidalUnitTile source port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.kicad]
portable = false

[dependencies]
kicad-math = { path = "../kicad-math" }
kicad-boost-random = { path = "../kicad-boost-random" }
kicad-difftest = { path = "../kicad-difftest" }
serde_json.workspace = true

[features]
# Replays the corpus in wasm32 against native C++ replies supplied at build time.
live-wasm = []

[[example]]
name = "corpus_parity"
required-features = ["live-wasm"]
