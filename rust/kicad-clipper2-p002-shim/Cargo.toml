[package]
name = "kicad-clipper2-p002-shim"
description = "Native JSONL adapter for the Clipper2 engine remainder and offset port (clipper.engine.cpp lines 2272-3337, clipper.offset.cpp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.kicad]
portable = false

[dependencies]
kicad-clipper2 = { path = "../kicad-clipper2" }
kicad-difftest = { path = "../kicad-difftest" }
kicad-math = { path = "../kicad-math" }
serde_json.workspace = true

[features]
live-wasm = []

[[example]]
name = "corpus_parity"
required-features = ["live-wasm"]
