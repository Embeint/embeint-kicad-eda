name: Rust libs/sexpr live validation
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-sexpr/**
      - rust/kicad-sexpr-shim/**
      - port/oracle/**
      - port/cases/libs.sexpr.include.sexpr.application.pure.p001.jsonl
      - port/cases/libs.sexpr.application.pure.p001.jsonl
      - port/units/libs.sexpr.include.sexpr.application.pure.p001.toml
      - port/units/libs.sexpr.application.pure.p001.toml
      - .github/workflows/rust-sexpr-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sexpr-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      ORACLE_JOBS: "2"
      GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX,-AVX2,-FMA,-FMA4,-AVX512F"
      LD_LIBRARY_PATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install toolchain and oracle dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.1
          # The image's packages.microsoft.com source is unused here and intermittently fails apt with 403.
          for src in /etc/apt/sources.list.d/*; do if grep -qs packages.microsoft.com "$src"; then sudo rm -f "$src"; fi; done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev
      - name: Check portable implementation, generated corpus and controls
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -p kicad-sexpr -p kicad-sexpr-shim --check
          cargo clippy --locked --manifest-path rust/Cargo.toml -p kicad-sexpr -p kicad-sexpr-shim --all-targets -j2 -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml -p kicad-sexpr -p kicad-sexpr-shim -j2
          cargo check --locked --manifest-path rust/Cargo.toml -p kicad-sexpr --target wasm32-unknown-unknown -j2
          python3 rust/kicad-sexpr-shim/generate_cases.py --check
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-sexpr-shim -p kicad-difftest -j2
      - name: Build genuine pinned own-library oracle
        run: |
          python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/sexpr-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/sexpr-stage" "$PWD/port/oracle" "$RUNNER_TEMP/sexpr-native"
      - name: Compare every public case and separate undefined-domain controls
        run: |
          out="$RUNNER_TEMP/sexpr-native"
          rust/target/debug/kicad-difftest compare --partial \
            --unit libs.sexpr.include.sexpr.application.pure.p001 --root "$PWD" \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-sexpr-shim" \
            --report "$out/compare-header.json"
          rust/target/debug/kicad-difftest compare --partial \
            --unit libs.sexpr.application.pure.p001 --root "$PWD" \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-sexpr-shim" \
            --report "$out/compare-source.json"
          python3 rust/kicad-sexpr-shim/compare_controls.py \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-sexpr-shim"
      - name: Execute every case and control in import-free WebAssembly
        run: |
          out="$RUNNER_TEMP/sexpr-native"
          python3 -c "import json,sys; [print(json.dumps(json.loads(l)['request'])) for l in open(sys.argv[1])]" \
            port/oracle/fixtures/sexpr-controls.jsonl > "$out/controls.jsonl"
          cat port/cases/libs.sexpr.include.sexpr.application.pure.p001.jsonl \
            port/cases/libs.sexpr.application.pure.p001.jsonl "$out/controls.jsonl" \
            | rust/target/debug/kicad-sexpr-shim > "$out/rust-native.jsonl"
          export KICAD_SEXPR_WASM_REFERENCE="$out/rust-native.jsonl"
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-sexpr-shim \
            --example corpus_parity --features live-wasm --target wasm32-unknown-unknown --release -j2
          node rust/kicad-sexpr-shim/wasm-test.mjs rust/target/wasm32-unknown-unknown/release/examples/corpus_parity.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sexpr-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sexpr-native/compare-*.json
            ${{ runner.temp }}/sexpr-native/oracle-build/oracle-provenance.json
            ${{ runner.temp }}/sexpr-native/oracle-build/compile_commands.json
            ${{ runner.temp }}/sexpr-native/oracle-build/binary.sha256
            ${{ runner.temp }}/sexpr-native/oracle-build/kicad-oracle
            ${{ runner.temp }}/sexpr-stage/source-manifest.json
          retention-days: 14
