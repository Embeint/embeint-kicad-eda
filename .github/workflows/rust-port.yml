name: Rust port harness and phase zero

on:
  pull_request:
    branches: [rust]
  push:
    branches: [rust]
  workflow_dispatch:
    inputs:
      migrate_resistor_sse2:
        description: Generate the reviewed one-time resistor SSE2 golden migration
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR heads need not consume another full clean oracle build. Pushes
# and manual migrations keep unique groups and are never cancelled by this rule.
concurrency:
  group: rust-port-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_BUILD_JOBS: "8"
  # Enabled by the phase zero integration of the three layer-0 pilots: the live
  # check runs with --require-phase0 and fails unless three live green layer-0
  # units and all generated unit records are valid.
  PHASE0_REQUIRED: "true"
  # Resistor reference migration: select the same locked glibc implementation
  # on runners with and without FMA. A runtime identity preflight below fails
  # closed if the selected distribution libraries change.
  RESISTOR_GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX,-AVX2,-FMA,-FMA4,-AVX512F"

jobs:
  rust-port:
    if: github.event_name != 'workflow_dispatch' || !inputs.migrate_resistor_sse2
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # The oracle exports the pinned upstream commit, not HEAD.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bootstrap pinned sources before any Cargo build
        shell: bash
        run: |
          if test -f port/tools/bootstrap_west.py; then
            python port/tools/bootstrap_west.py
            .port-venv/linux/bin/west update
            python port/tools/bootstrap_west.py --check
          elif test -f west.yml || test "$PHASE0_REQUIRED" = true; then
            echo '::error::west manifest requires the foundation bootstrap'
            exit 1
          else
            echo '::notice::Harness-only checkout: foundation has not landed; no external dependency is used'
          fi
      - name: Install pinned Rust toolchain and WebAssembly target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      # Deliberately no compiled oracle/Rust cache. The small own-library oracle
      # is rebuilt and audited, so a stale source/flag cache cannot certify it.
      - name: Format, lint and test the Rust workspace
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -j8 -- -D warnings
          cargo test --locked --workspace -j8
          cargo build --locked -p kicad-difftest -j8
      - name: Build every portable crate for wasm32-unknown-unknown
        run: python port/tools/check_goldens_policy.py --wasm
      - name: Execute resistor WebAssembly parity
        run: |
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-resistors \
            --example nonfinite_parity --target wasm32-unknown-unknown --release -j8
          node rust/kicad-resistors/wasm-test.mjs \
            rust/target/wasm32-unknown-unknown/release/examples/nonfinite_parity.wasm
      - name: Test evidence policy and staged gate
        run: |
          python -m unittest discover -s rust/kicad-difftest/tests -p test_policy.py -v
          python -m unittest discover -s port/tools -p test_resistor_migration.py -v
      - name: Require evidence for changed goldens
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          base="$POLICY_BASE"
          if test -z "$base" || test "$base" = 0000000000000000000000000000000000000000; then
            base=$(git merge-base HEAD origin/rust)
          fi
          python port/tools/check_goldens_policy.py --base "$base"
      - name: Detect the own-library oracle
        id: oracle
        shell: bash
        run: |
          if test -f port/oracle/build.sh; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Harness-only checkout: live oracle build has not landed'
            if test "$PHASE0_REQUIRED" = true; then exit 1; fi
          fi
      - name: Install minimal oracle dependencies
        if: steps.oracle.outputs.available == 'true'
        run: |
          # The image's packages.microsoft.com source is unused here and intermittently fails apt with 403.
          for src in /etc/apt/sources.list.d/*; do if grep -qs packages.microsoft.com "$src"; then sudo rm -f "$src"; fi; done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev pkg-config libglib2.0-dev libgtk-3-dev libsecret-1-dev libpoppler-glib-dev
      - name: Build and audit KiCad own-library oracle
        if: steps.oracle.outputs.available == 'true'
        env:
          ORACLE_JOBS: "2"
          GLIBC_TUNABLES: ${{ env.RESISTOR_GLIBC_TUNABLES }}
          LD_LIBRARY_PATH: ""
        run: |
          # setup-python's library path belongs to that interpreter. Use the
          # distribution interpreter and loader for the reference toolchain.
          export PATH="/usr/bin:/bin:$PATH"
          /usr/bin/python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/oracle-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/oracle-stage" "$PWD/port/oracle" "$HOME/kicad-port"
          "$HOME/kicad-port/oracle-build/kicad-oracle" --provenance > oracle-provenance.json
      - name: Verify the resistor reference runtime
        if: steps.oracle.outputs.available == 'true'
        env:
          GLIBC_TUNABLES: ${{ env.RESISTOR_GLIBC_TUNABLES }}
          LD_LIBRARY_PATH: ""
        run: |
          /usr/bin/python3 -m unittest discover -s port/oracle -p test_resistor_reference.py -v
          /usr/bin/python3 port/oracle/check_resistor_reference.py \
            --oracle "$HOME/kicad-port/oracle-build/kicad-oracle" \
            --report resistor-runtime.json
      - name: Validate all unit records, goldens and available live cases
        env:
          GLIBC_TUNABLES: ${{ env.RESISTOR_GLIBC_TUNABLES }}
          LD_LIBRARY_PATH: ""
        shell: bash
        run: |
          strict=()
          if test "$PHASE0_REQUIRED" = true; then strict=(--require-phase0); fi
          /usr/bin/python3 port/tools/check_goldens_policy.py --ci \
            --runner "$PWD/rust/target/debug/kicad-difftest" \
            --oracle "$HOME/kicad-port/oracle-build/kicad-oracle" \
            --reports difftest-reports "${strict[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-port-difftest-evidence
          path: |
            difftest-reports/
            oracle-provenance.json
            resistor-runtime.json
            resistor-migration/
            port/goldens/pcb_calculator.application.pure.p001.jsonl
            port/goldens/evidence/pcb_calculator.application.pure.p001-glibc239-sse2-v1.json
            ~/kicad-port/oracle-build/oracle-provenance.json
            ~/kicad-port/oracle-build/binary.sha256
            ~/kicad-port/oracle-build/compile_commands.json
            ~/kicad-port/oracle-build/kicad-oracle
            ~/kicad-port/oracle-build/CMakeFiles/kicad-oracle.dir/shims/kimath_math.cpp.o
            ~/kicad-port/oracle-src/overlay/shims/kimath_math.cpp
            ~/kicad-port/oracle-src/reference/libs/kimath/include/math/matrix3x3.h
            ~/kicad-port/oracle-src/reference/libs/kimath/include/math/vector2d.h
            ~/kicad-port/oracle-src/reference/libs/kimath/include/math/vector3.h
            rust/target/debug/kicad-math-shim
            ~/kicad-port/oracle-src/reference/source-manifest.json
          if-no-files-found: warn

  # rust-version in rust/Cargo.toml stays true for the port crates. rust-layout.yml
  # checks it for the embeint-* crates and no longer runs on port-only changes, so
  # the whole workspace is checked here, in parallel with the uncached gate above.
  msrv:
    if: github.event_name != 'workflow_dispatch' || !inputs.migrate_resistor_sse2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_MSRV: "1.85.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the declared minimum Rust
        run: rustup toolchain install "$RUST_MSRV" --profile minimal
      # A plain compile check, not evidence: caching it cannot certify anything.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-port-msrv-${{ env.RUST_MSRV }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-port-msrv-${{ env.RUST_MSRV }}-
      - name: Check the workspace with the declared minimum Rust
        working-directory: rust
        run: cargo "+$RUST_MSRV" check --locked --workspace --all-targets -j8

  resistor-migration:
    if: github.event_name == 'workflow_dispatch' && inputs.migrate_resistor_sse2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          path: source
      # The measurement image is the candidate locked at the dispatched revision itself:
      # its lock must contain the packages the current oracle needs (the font
      # libraries since candidate-2; the compiler, libm, runtime and Rust identity
      # files are those of candidate-1 used by the original migration). The image
      # remains an unqualified candidate. The migration itself was applied once
      # (cee4373220): migrate_resistor_reference.py still requires the candidate-1
      # lock and the pre-migration golden, so on later revisions this job fails
      # closed before blessing anything.
      - name: Build and verify the locked measurement image twice
        env:
          ORACLE_JOBS: "2"
        run: |
          bash source/port/reference-env/qualify.sh \
            --revision "$GITHUB_SHA" \
            --work "$HOME/resistor-reference-image" --rebuild-check --sweep-count 200000
      - name: Seal the exact migration source
        run: |
          tool="$PWD/source/port/reference-env/tools/source_binding.py"
          python3 "$tool" export --repo "$PWD/source" --revision "$GITHUB_SHA" \
            --out "$HOME/resistor-source-bundle"
          digest=$(sha256sum "$HOME/resistor-source-bundle/source.json" | cut -d' ' -f1)
          python3 "$tool" materialize --bundle "$HOME/resistor-source-bundle" \
            --revision "$GITHUB_SHA" --source-sha256 "$digest" --out "$HOME/resistor-source"
          printf '%s\n' "$digest" > "$HOME/resistor-source.sha256"
      - name: Compare and generate the reviewed migration from the live oracle
        run: |
          image_run=$(find "$HOME/resistor-reference-image/runs" -mindepth 1 -maxdepth 1 -type d)
          test -d "$image_run"
          image=$(cat "$image_run/image.iid")
          mkdir -p "$HOME/resistor-migration/work/home" "$PWD/resistor-migration"
          docker image inspect "$image" > "$PWD/resistor-migration/image-inspect.json"
          cp "$image_run/image-identity.json" "$image_run/rebuild-identity.json" \
            "$image_run/rebuild-check.txt" "$PWD/resistor-migration/"
          cp "$HOME/resistor-source/source.json" "$HOME/resistor-source.sha256" "$PWD/resistor-migration/"
          docker run --rm --memory=8g --memory-swap=8g --cpus=4 \
            --user "$(id -u):$(id -g)" -e HOME=/work/home -e CARGO_HOME=/work/home/cargo \
            -e ORACLE_JOBS=2 -e CARGO_BUILD_JOBS=2 -e PYTHONDONTWRITEBYTECODE=1 \
            -e "REVISION=$GITHUB_SHA" -e "SOURCE_SHA=$(cat "$HOME/resistor-source.sha256")" \
            -v "$HOME/resistor-source:/snapshot" -v "$HOME/resistor-migration/work:/work" \
            -v "$PWD/resistor-migration:/out" -w /snapshot/source "$image" bash -c '
              set -euo pipefail
              python3 /opt/refenv/image/verify_image.py --lock /opt/refenv/inputs.lock.json \
                --candidate /opt/refenv/candidate.toml --expect /opt/refenv/image-identity.json
              check_source() { python3 /opt/refenv/source_binding.py check --bundle /snapshot \
                --revision "$REVISION" --source-sha256 "$SOURCE_SHA"; }
              check_source
              bash port/oracle/build.sh /snapshot/stage "$PWD/port/oracle" /work/oracle
              python3 port/tools/bootstrap_west.py
              python3 port/tools/bootstrap_west.py --check
              cargo build --locked --manifest-path rust/Cargo.toml -p kicad-difftest -p kicad-resistors-shim -j2
              python3 -m unittest discover -s port/tools -p test_resistor_migration.py -v
              check_source
              mkdir -p /out/proposal/port/cases /out/proposal/port/goldens
              cp port/cases/pcb_calculator.application.pure.p001.jsonl /out/proposal/port/cases/
              cp port/goldens/pcb_calculator.application.pure.p001.jsonl /out/proposal/port/goldens/
              python3 port/tools/migrate_resistor_reference.py --root "$PWD" \
                --golden-root /out/proposal --oracle /work/oracle/oracle-build/kicad-oracle --out /out/run
              cp /work/oracle/oracle-build/binary.sha256 /work/oracle/oracle-build/compile_commands.json /out/run/
              check_source'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: resistor-reference-migration
          path: resistor-migration/
          if-no-files-found: warn
