name: Rust arc construction live validation
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-arc-construction-shim/**
      - rust/kicad-math/**
      - port/oracle/**
      - port/cases/libs.kimath.src.geometry.arc_construction.application.ui.p001.jsonl
      - port/units/libs.kimath.src.geometry.arc_construction.application.ui.p001.toml
      - .github/workflows/rust-arc-construction-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arc-construction-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      ORACLE_JOBS: "2"
      GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX,-AVX2,-FMA,-FMA4,-AVX512F"
      LD_LIBRARY_PATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install toolchain and oracle dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.1
          # The image's packages.microsoft.com source is unused here and intermittently fails apt with 403.
          for src in /etc/apt/sources.list.d/*; do if grep -qs packages.microsoft.com "$src"; then sudo rm -f "$src"; fi; done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev
      - name: Check portable implementation, generated corpus and controls
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -p kicad-math -p kicad-arc-construction-shim --check
          cargo clippy --locked --manifest-path rust/Cargo.toml -p kicad-math -p kicad-arc-construction-shim --all-targets -j2 -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml -p kicad-math -p kicad-arc-construction-shim -p kicad-vector-shim -p kicad-util-box-shim -j2
          cargo check --locked --manifest-path rust/Cargo.toml -p kicad-math --target wasm32-unknown-unknown -j2
          python3 rust/kicad-arc-construction-shim/generate_cases.py --check
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-arc-construction-shim -p kicad-difftest \
            -p kicad-vector-shim -p kicad-util-box-shim -j2
      - name: Build genuine pinned own-library oracle
        run: |
          python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/arc-construction-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/arc-construction-stage" "$PWD/port/oracle" "$RUNNER_TEMP/arc-construction-native"
      - name: Compare every public case, harness controls and the affected vector callers
        run: |
          out="$RUNNER_TEMP/arc-construction-native"
          bin="$PWD/rust/target/debug"
          "$bin/kicad-difftest" compare --partial \
            --unit libs.kimath.src.geometry.arc_construction.application.ui.p001 --root "$PWD" \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$bin/kicad-arc-construction-shim" \
            --report "$out/compare.json"
          python3 rust/kicad-arc-construction-shim/compare_controls.py \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$bin/kicad-arc-construction-shim"
          # The finite VECTOR2<double>::EuclideanNorm wiring also reaches these owners' corpora.
          "$bin/kicad-difftest" compare --partial --unit libs.kimath.include.math.application.ui.p002 \
            --root "$PWD" --oracle "$out/oracle-build/kicad-oracle" --rust "$bin/kicad-vector-shim" \
            --report "$out/compare-vector.json"
          "$bin/kicad-difftest" compare --partial --unit libs.kimath.include.math.application.ui.p001 \
            --root "$PWD" --oracle "$out/oracle-build/kicad-oracle" --rust "$bin/kicad-util-box-shim" \
            --report "$out/compare-util-box.json"
      - name: Execute all portable paths in import-free WebAssembly
        run: |
          out="$RUNNER_TEMP/arc-construction-native"
          rust/target/debug/kicad-arc-construction-shim < port/cases/libs.kimath.src.geometry.arc_construction.application.ui.p001.jsonl > "$out/rust-native.jsonl"
          export KICAD_ARC_CONSTRUCTION_WASM_REFERENCE="$out/rust-native.jsonl"
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-arc-construction-shim \
            --example corpus_parity --features live-wasm --target wasm32-unknown-unknown --release -j2
          node rust/kicad-arc-construction-shim/wasm-test.mjs rust/target/wasm32-unknown-unknown/release/examples/corpus_parity.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arc-construction-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/arc-construction-native/compare*.json
            ${{ runner.temp }}/arc-construction-native/rust-native.jsonl
            ${{ runner.temp }}/arc-construction-native/oracle-build/oracle-provenance.json
            ${{ runner.temp }}/arc-construction-native/oracle-build/binary.sha256
            ${{ runner.temp }}/arc-construction-stage/source-manifest.json
          retention-days: 14
