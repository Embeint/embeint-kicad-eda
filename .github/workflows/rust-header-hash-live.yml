name: Rust header hash live validation

# Diagnostic prerequisite to the ordinary rust-port gate: stale golden evidence must
# not prevent measuring the current implementation. PR runs never bless. Explicit
# manual generation produces only the exact audited artifact, never a commit or
# publication. The main gate, binding failures and comparison rules stay unchanged.
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-hash/**
      - rust/kicad-hash-shim/**
      - rust/kicad-math/**
      - port/oracle/**
      - port/cases/libs.kimath.include.application.pure.p001.jsonl
      - .github/workflows/rust-header-hash-live.yml
  workflow_dispatch:
    inputs:
      generate_golden:
        description: Generate the exact audited baseline as artifacts after live validation; no publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-header-hash-live-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  RUST_TOOLCHAIN: "1.99.1"
  REFERENCE_TUNABLES: glibc.cpu.hwcaps=-AVX,-AVX2,-FMA,-FMA4,-AVX512F

jobs:
  hash-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the native oracle prerequisites
        run: |
          # The image's packages.microsoft.com source is unused here and intermittently fails apt with 403.
          for src in /etc/apt/sources.list.d/*; do if grep -qs packages.microsoft.com "$src"; then sudo rm -f "$src"; fi; done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev libfreetype-dev libharfbuzz-dev libfontconfig-dev pkg-config libglib2.0-dev libgtk-3-dev libsecret-1-dev libpoppler-glib-dev
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Bootstrap pinned sources and build the Rust shims
        run: |
          python port/tools/bootstrap_west.py
          .port-venv/linux/bin/west update
          python port/tools/bootstrap_west.py --check
          cd rust
          cargo build --locked -p kicad-difftest -p kicad-hash-shim -j2
          cargo build --locked --release -p kicad-hash-shim -j2
      - name: Test the one-time golden approval boundary
        run: python -B -m unittest discover -s rust/kicad-hash-shim -p 'test_*.py' -v
      - name: Build and audit the real pinned oracle
        env:
          ORACLE_JOBS: "2"
          GLIBC_TUNABLES: ${{ env.REFERENCE_TUNABLES }}
          LD_LIBRARY_PATH: ""
        run: |
          export PATH="/usr/bin:/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/hash-live"
          /usr/bin/python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/hash-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/hash-stage" "$PWD/port/oracle" "$HOME/kicad-port"
          "$HOME/kicad-port/oracle-build/kicad-oracle" --provenance > "$RUNNER_TEMP/hash-live/provenance.json"
          /usr/bin/python3 port/oracle/check_resistor_reference.py \
            --oracle "$HOME/kicad-port/oracle-build/kicad-oracle" \
            --report "$RUNNER_TEMP/hash-live/runtime.json"
      - name: Check bindings, live replies, guards and wasm
        env:
          GLIBC_TUNABLES: ${{ env.REFERENCE_TUNABLES }}
          LD_LIBRARY_PATH: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash rust/kicad-hash-shim/hosted_validation.sh \
            "$HOME/kicad-port/oracle-build" "$RUNNER_TEMP/hash-live"
      - name: Generate only the exact audited baseline after live agreement
        if: github.event_name == 'workflow_dispatch' && inputs.generate_golden
        env:
          GLIBC_TUNABLES: ${{ env.REFERENCE_TUNABLES }}
          LD_LIBRARY_PATH: ""
        run: |
          set -euo pipefail
          unit=libs.kimath.include.application.pure.p001
          out="$RUNNER_TEMP/hash-live"
          common=(--unit "$unit" --root "$PWD" --oracle "$HOME/kicad-port/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-hash-shim")
          approval=(--approval "$out/approval.json" --provenance "$out/provenance.json")
          rust/target/debug/kicad-difftest propose "${common[@]}" "${approval[@]}" --report "$out/propose.json"
          /usr/bin/python3 rust/kicad-hash-shim/approve_golden.py --root "$PWD" --approval "$out/approval.json" --runtime "$out/runtime.json"
          evidence="port/goldens/evidence/$unit-defined-mmh3-bezier-gcc133-v2.json"
          rust/target/debug/kicad-difftest bless "${common[@]}" "${approval[@]}" --evidence "$evidence" --report "$out/bless.json"
          rust/target/debug/kicad-difftest check "${common[@]}" --report "$out/check.json"
          cp "port/goldens/$unit.jsonl" "$out/golden.jsonl"
          cp "$evidence" "$out/evidence.json"
          # The unit is new to official rust; retain a second live blessing from
          # that empty baseline so base-relative policy can verify the final PR.
          base_root="$RUNNER_TEMP/hash-base"
          git rev-parse --verify origin/rust
          git ls-tree origin/rust -- "port/goldens/$unit.jsonl" > "$out/base-golden-tree.txt"
          test ! -s "$out/base-golden-tree.txt"
          mkdir -p "$base_root/port/cases" "$base_root/port/goldens/evidence"
          cp "port/cases/$unit.jsonl" "$base_root/port/cases/"
          base_common=(--unit "$unit" --root "$base_root" --oracle "$HOME/kicad-port/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-hash-shim")
          base_approval=(--approval "$out/approval-base.json" --provenance "$out/provenance.json")
          rust/target/debug/kicad-difftest propose "${base_common[@]}" "${base_approval[@]}" --report "$out/propose-base.json"
          /usr/bin/python3 rust/kicad-hash-shim/approve_golden.py --root "$base_root" --approval "$out/approval-base.json" --runtime "$out/runtime.json" --base-empty
          base_evidence="$base_root/port/goldens/evidence/$unit-defined-mmh3-bezier-gcc133-full-v2.json"
          rust/target/debug/kicad-difftest bless "${base_common[@]}" "${base_approval[@]}" --evidence "$base_evidence" --report "$out/bless-base.json"
          rust/target/debug/kicad-difftest check "${base_common[@]}" --report "$out/check-base.json"
          cmp "port/goldens/$unit.jsonl" "$base_root/port/goldens/$unit.jsonl"
          cp "$base_evidence" "$out/evidence-base.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: header-hash-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hash-live/
            ~/kicad-port/oracle-build/oracle-provenance.json
            ~/kicad-port/oracle-build/compile_commands.json
            ~/kicad-port/oracle-build/binary.sha256
            ~/kicad-port/oracle-build/kicad-oracle
            ~/kicad-port/oracle-build/CMakeFiles/kicad-oracle.dir/shims/kimath_header_hash.cpp.o
          if-no-files-found: warn
          retention-days: 14
