name: Rust application include/core live validation
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-core-app-include-shim/**
      - rust/kicad-core/**
      - rust/kicad-math/**
      - rust/vendor/stack_dst/**
      - rust/Cargo.toml
      - rust/Cargo.lock
      - port/oracle/**
      - port/cases/include.core.application.pure.p001.jsonl
      - port/units/include.core.application.pure.p001.toml
      - .github/workflows/rust-core-app-include-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-app-include-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      ORACLE_JOBS: "2"
      LD_LIBRARY_PATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install toolchain and oracle dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.1
          # The image's packages.microsoft.com source is unused here and intermittently fails apt with 403.
          for src in /etc/apt/sources.list.d/*; do if grep -qs packages.microsoft.com "$src"; then sudo rm -f "$src"; fi; done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev
      - name: Check portable implementation, generated corpus and controls
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -p kicad-core -p kicad-math -p kicad-core-app-include-shim --check
          cargo clippy --locked --manifest-path rust/Cargo.toml -p kicad-core -p kicad-math -p kicad-core-app-include-shim --all-targets -j2 -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml -p kicad-core -p kicad-math -p kicad-core-app-include-shim -p kicad-ellipse-shim -j2
          cargo check --locked --manifest-path rust/Cargo.toml -p kicad-core -p kicad-math --target wasm32-unknown-unknown -j2
          cargo test --manifest-path rust/vendor/stack_dst/Cargo.toml -j2
          python3 rust/kicad-core-app-include-shim/generate_cases.py --check
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-core-app-include-shim -p kicad-difftest -j2
      - name: Build genuine pinned own-library oracle
        run: |
          python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/app-include-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/app-include-stage" "$PWD/port/oracle" "$RUNNER_TEMP/app-include-native"
      - name: Compare every public case and the separate refusal controls
        run: |
          out="$RUNNER_TEMP/app-include-native"
          rust/target/debug/kicad-difftest compare --partial \
            --unit include.core.application.pure.p001 --root "$PWD" \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-core-app-include-shim" \
            --report "$out/compare.json"
          python3 rust/kicad-core-app-include-shim/compare_controls.py \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-core-app-include-shim"
      - name: Execute every case and control in import-free WebAssembly
        run: |
          out="$RUNNER_TEMP/app-include-native"
          python3 rust/kicad-core-app-include-shim/compare_controls.py --write-requests "$out/controls.jsonl"
          cat port/cases/include.core.application.pure.p001.jsonl "$out/controls.jsonl" \
            | rust/target/debug/kicad-core-app-include-shim > "$out/rust-native.jsonl"
          export KICAD_CORE_APP_INCLUDE_WASM_REFERENCE="$out/rust-native.jsonl"
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-core-app-include-shim \
            --example corpus_parity --features live-wasm --target wasm32-unknown-unknown --release -j2
          node rust/kicad-core-app-include-shim/wasm-test.mjs rust/target/wasm32-unknown-unknown/release/examples/corpus_parity.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-app-include-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/app-include-native/compare.json
            ${{ runner.temp }}/app-include-native/oracle-build/oracle-provenance.json
            ${{ runner.temp }}/app-include-native/oracle-build/compile_commands.json
            ${{ runner.temp }}/app-include-native/oracle-build/binary.sha256
            ${{ runner.temp }}/app-include-native/oracle-build/kicad-oracle
            ${{ runner.temp }}/app-include-stage/source-manifest.json
          retention-days: 14
