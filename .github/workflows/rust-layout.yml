name: Rust layout parity

# Portable Rust checks, separate from the MCP unit tests (mcp.yml) so neither slows the other.
# The parity harness also runs when the authoritative Python layout changes, so a change there
# that the Rust port does not follow fails here.
on:
  pull_request:
    paths:
      - "rust/**"
      - "tools/live_schematic_mcp/symbol_layout.py"
      - "tools/live_schematic_mcp/layout_backend.py"
      - "tools/live_schematic_mcp/test_layout_backend.py"
      - ".github/workflows/rust-layout.yml"
  push:
    branches: [main, live-schematic-ipc]
    paths:
      - "rust/**"
      - "tools/live_schematic_mcp/symbol_layout.py"
      - "tools/live_schematic_mcp/layout_backend.py"
      - "tools/live_schematic_mcp/test_layout_backend.py"
      - ".github/workflows/rust-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned, so that a new stable release (and its new clippy lints) cannot fail unrelated pull
  # requests.  Bump it deliberately, together with any lint fixes.
  RUST_TOOLCHAIN: "1.99.1"
  # rust-version in rust/Cargo.toml: checked so the declared minimum stays true.
  RUST_MSRV: "1.85.0"

jobs:
  layout-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Install the Rust toolchains and the WebAssembly target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup toolchain install "$RUST_MSRV" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-layout-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_MSRV }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Format and lint
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --release --all-targets -- -D warnings
          # The WebAssembly exports only exist on 32-bit targets, so lint that build too.
          cargo clippy --locked --release -p embeint-web --target wasm32-unknown-unknown -- -D warnings
      - name: Minimum supported Rust version
        working-directory: rust
        run: |
          cargo "+$RUST_MSRV" check --locked --all-targets
          cargo "+$RUST_MSRV" check --locked -p embeint-web --target wasm32-unknown-unknown
      - name: Unit tests
        working-directory: rust
        run: cargo test --locked --release
      - name: Build the WebAssembly module
        working-directory: rust
        run: cargo build --locked --release -p embeint-web --target wasm32-unknown-unknown
      - name: WebAssembly loader tests
        run: node --test rust/embeint-web/js/embeint_layout.test.mjs
      # parity.py takes the module path from this build's cargo output, so a stale module from the
      # cache can never be compared, and with --require-wasm a failed WASM build fails the run.
      - name: Python, native and WebAssembly parity
        run: python rust/parity/parity.py --build --require-wasm --bench 50 --report parity-report.json
      # The MCP's opt-in backend against the runner the parity step just built in rust/target/release
      # (mcp.yml has no runner and skips these cases; here a missing runner fails them).
      - name: MCP layout backend against the native runner
        working-directory: tools/live_schematic_mcp
        env:
          EMBEINT_LAYOUT_REQUIRE_RUNNER: "1"
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider test_layout_backend.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: rust-layout-parity-report
          path: parity-report.json
          if-no-files-found: ignore
