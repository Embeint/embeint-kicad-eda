name: Rust glibc angle libm fresh reference
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-math/**
      - port/glibc-libm/**
      - port/glibc-trig/**
      - .github/workflows/rust-glibc-libm.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-glibc-libm-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: "3"
  RUST_TOOLCHAIN: "1.99.1"
  INPUT_LOCK_COMMIT: 33535308d33e019f04af6e089b14ca593ea84ccb
jobs:
  glibc-libm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Prepare pinned tools and sources
        run: |
          out="$RUNNER_TEMP/glibc-libm"
          mkdir -p "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$PWD/rust/target" >> "$GITHUB_ENV"
          { echo "head $GITHUB_SHA"; node --version; gcc --version | head -1; uname -srm; python3 --version; } > "$out/tools.txt"
          python3 port/tools/bootstrap_west.py
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-wasip1 --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          { rustc -vV; cargo -V; } >> "$out/tools.txt"
          git fetch --no-tags --depth=1 origin "$INPUT_LOCK_COMMIT"
          git show "$INPUT_LOCK_COMMIT:port/reference-env/inputs.lock.json" > "$out/inputs.lock.json"
      - name: Check source coefficients and harness refusal paths
        run: |
          python3 port/glibc-libm/check_sources.py --out "$OUT"
          python3 -I -B -m unittest discover -s port/glibc-libm -p 'test_*.py' -v
          cargo fmt --manifest-path rust/Cargo.toml -p kicad-math --check
          cargo fmt --manifest-path port/glibc-libm/wasm/Cargo.toml --check
          cargo clippy --locked --manifest-path rust/Cargo.toml -p kicad-math --all-targets -j3 -- -D warnings
      - name: Generate fixed boundaries and one million seeded inputs per function
        run: python3 port/glibc-libm/reference.py domain --out "$OUT"
      - name: Execute genuine locked glibc through its own loader
        id: reference
        run: python3 port/glibc-libm/reference.py reference --out "$OUT"
      - name: Native debug and release
        if: ${{ !cancelled() && steps.reference.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          export KICAD_GLIBC_LIBM_REFERENCE="$OUT/reference.bin"
          export KICAD_GLIBC_LIBM_COUNT=$(python3 -c 'import json; print(json.load(open("port/glibc-libm/qualification.json"))["domain"]["count"])')
          for profile in dev release; do
            name=$([ "$profile" = dev ] && echo debug || echo release)
            cargo test --locked --manifest-path rust/Cargo.toml -p kicad-math --lib --profile "$profile" glibc_libm -- --include-ignored --nocapture 2>&1 | tee "$OUT/native-$name.log"
          done
      - name: WASI debug and release
        if: ${{ !cancelled() && steps.reference.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          export KICAD_GLIBC_LIBM_REFERENCE="$OUT/reference.bin"
          export KICAD_GLIBC_LIBM_COUNT=$(python3 -c 'import json; print(json.load(open("port/glibc-libm/qualification.json"))["domain"]["count"])')
          for profile in dev release; do
            name=$([ "$profile" = dev ] && echo debug || echo release)
            wasm=$(cargo test --locked --manifest-path rust/Cargo.toml -p kicad-math --lib --target wasm32-wasip1 --profile "$profile" --no-run --message-format=json | python3 port/glibc-libm/reference.py wasi-test)
            node port/glibc-trig/node_wasi_test.mjs "$wasm" "$OUT" glibc_libm --include-ignored --nocapture 2>&1 | tee "$OUT/wasip1-$name.log"
          done
      - name: Import-free wasm32-unknown-unknown debug and release
        if: ${{ !cancelled() && steps.reference.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          count=$(python3 -c 'import json; print(json.load(open("port/glibc-libm/qualification.json"))["domain"]["count"])')
          for profile in dev release; do
            name=$([ "$profile" = dev ] && echo debug || echo release)
            cargo build --locked --manifest-path port/glibc-libm/wasm/Cargo.toml --target wasm32-unknown-unknown --profile "$profile" -j3
            module="$CARGO_TARGET_DIR/wasm32-unknown-unknown/$name/kicad_math_wasm_libm.wasm"
            node port/glibc-libm/wasm/check.mjs "$module" "$OUT/reference.bin" "$count" 2>&1 | tee "$OUT/unknown-$name.log"
          done
      - name: Report all required comparisons
        if: always()
        run: python3 port/glibc-libm/reference.py report --out "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: glibc-angle-libm-${{ github.run_id }}
          path: ${{ runner.temp }}/glibc-libm/
          retention-days: 14
