name: Rust Clipper2 engine source (p001) live validation
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-clipper2/**
      - rust/kicad-clipper2-shim/**
      - rust/kicad-clipper2-engine-shim/**
      - rust/kicad-math/**
      - rust/kicad-difftest/**
      - rust/Cargo.toml
      - rust/Cargo.lock
      - port/oracle/**
      - port/cases/thirdparty.clipper2.clipper2lib.src.thirdparty.pure.p001.jsonl
      - port/units/thirdparty.clipper2.clipper2lib.src.thirdparty.pure.p001.toml
      - .github/workflows/rust-clipper2-engine-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipper2-engine-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      ORACLE_JOBS: "2"
      UNIT: thirdparty.clipper2.clipper2lib.src.thirdparty.pure.p001
      GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX,-AVX2,-FMA,-FMA4,-AVX512F"
      LD_LIBRARY_PATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install toolchain and oracle dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev
      - name: Check the portable implementation and the generated corpus
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -p kicad-clipper2 -p kicad-clipper2-engine-shim --check
          cargo clippy --locked --manifest-path rust/Cargo.toml -p kicad-clipper2 -p kicad-clipper2-engine-shim --all-targets -j2 -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml -p kicad-clipper2 -p kicad-clipper2-engine-shim -j2
          cargo check --locked --manifest-path rust/Cargo.toml -p kicad-clipper2 --target wasm32-unknown-unknown -j2
          python3 rust/kicad-clipper2-engine-shim/generate_cases.py --check
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-clipper2-engine-shim -p kicad-difftest -j2
      - name: Build the genuine pinned own-library oracle
        run: |
          python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/clipper2-engine-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/clipper2-engine-stage" "$PWD/port/oracle" "$RUNNER_TEMP/clipper2-engine-native"
      - name: Compare every public case exactly and the separate undefined-behaviour controls
        run: |
          out="$RUNNER_TEMP/clipper2-engine-native"
          rust/target/debug/kicad-difftest compare --partial --unit "$UNIT" --root "$PWD" \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-clipper2-engine-shim" \
            --report "$out/compare.json"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print({k: r[k] for k in ('status','cases','compared','deferred','failures','unprocessed')})" "$out/compare.json"
          python3 rust/kicad-clipper2-engine-shim/compare_controls.py \
            --oracle "$out/oracle-build/kicad-oracle" --rust "$PWD/rust/target/debug/kicad-clipper2-engine-shim"
      - name: Replay the corpus and controls in import-free WebAssembly
        run: |
          out="$RUNNER_TEMP/clipper2-engine-native"
          rust/target/debug/kicad-clipper2-engine-shim < "port/cases/$UNIT.jsonl" > "$out/rust-native.jsonl"
          export KICAD_CLIPPER2_ENGINE_WASM_REFERENCE="$out/rust-native.jsonl"
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-clipper2-engine-shim \
            --example corpus_parity --features live-wasm --target wasm32-unknown-unknown --release -j2
          node rust/kicad-clipper2-engine-shim/wasm-test.mjs rust/target/wasm32-unknown-unknown/release/examples/corpus_parity.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: clipper2-engine-p001-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clipper2-engine-native/compare.json
            ${{ runner.temp }}/clipper2-engine-native/rust-native.jsonl
            ${{ runner.temp }}/clipper2-engine-native/oracle-build/oracle-provenance.json
            ${{ runner.temp }}/clipper2-engine-native/oracle-build/compile_commands.json
            ${{ runner.temp }}/clipper2-engine-native/oracle-build/binary.sha256
            ${{ runner.temp }}/clipper2-engine-stage/source-manifest.json
          retention-days: 14
