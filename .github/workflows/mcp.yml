name: MCP contracts

on:
  pull_request:
    paths:
      - "api/proto/**"
      - "common/**"
      - "eeschema/**"
      - "pcbnew/**"
      - "include/**"
      - "kicad/**"
      - "tools/live_schematic_mcp/**"
      - ".github/workflows/mcp.yml"
  push:
    branches: [main, live-schematic-ipc]
    paths:
      - "api/proto/**"
      - "common/**"
      - "eeschema/**"
      - "pcbnew/**"
      - "include/**"
      - "kicad/**"
      - "tools/live_schematic_mcp/**"
      - ".github/workflows/mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-contracts:
    # Pull requests always stay hosted, including branches in this repository.
    # The opt-in is enabled only while the isolated runner is verified online.
    runs-on: ${{ fromJSON(vars.KICAD_CI_RUNNER_ENABLED == 'true' && github.repository == 'Embeint/embeint-kicad-eda' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["kicad-ci-isolated-linux-x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: tools/live_schematic_mcp/requirements.txt
      - name: Install MCP test dependencies
        run: python -m pip install -r tools/live_schematic_mcp/requirements.txt
      - name: Generate protocols from this checkout
        run: python tools/live_schematic_mcp/generate_proto.py
      - name: Run unit, native operation coverage and stdio contracts without KiCad
        run: >-
          python -m pytest -q -p no:cacheprovider
          tools/live_schematic_mcp
