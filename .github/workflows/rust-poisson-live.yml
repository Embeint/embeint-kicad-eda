name: Rust poisson disk live validation

# Scoped live evidence for libs.kimath.src.geometry.poisson_disk.application.pure.p001: the
# genuine pinned oracle (POISSON_DISK::ToroidalUnitTile and the Boost.Random 1.83 templates it
# instantiates) against the Rust shim, the refusal controls and exact-limit probes on both, and
# the corpus plus controls replayed in import-free wasm32 against this run's native C++ replies.
# The rust-port job remains the gate.
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-boost-random/**
      - rust/kicad-math/**
      - rust/kicad-poisson-shim/**
      - rust/Cargo.toml
      - rust/Cargo.lock
      - port/oracle/**
      - port/cases/libs.kimath.src.geometry.poisson_disk.application.pure.p001.jsonl
      - port/units/libs.kimath.src.geometry.poisson_disk.application.pure.p001.toml
      - .github/workflows/rust-poisson-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poisson-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      ORACLE_JOBS: "2"
      GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX,-AVX2,-FMA,-FMA4,-AVX512F"
      UNIT: libs.kimath.src.geometry.poisson_disk.application.pure.p001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # The oracle exports the pinned upstream commit, not HEAD.
      - name: Install toolchain and oracle dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev
          dpkg-query -W libboost1.83-dev g++ libc6
      - name: Check the portable implementation and deterministic corpus
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -p kicad-boost-random -p kicad-math -p kicad-poisson-shim --check
          cargo clippy --locked --manifest-path rust/Cargo.toml -p kicad-boost-random -p kicad-math -p kicad-poisson-shim --all-targets -j2 -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml -p kicad-boost-random -p kicad-math -p kicad-poisson-shim -j2
          cargo check --locked --manifest-path rust/Cargo.toml -p kicad-boost-random -p kicad-math --target wasm32-unknown-unknown -j2
          python3 rust/kicad-poisson-shim/generate_cases.py --check
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-difftest -p kicad-poisson-shim -j2
      - name: Build the genuine pinned own-library oracle
        env:
          LD_LIBRARY_PATH: ""
        run: |
          export PATH="/usr/bin:/bin:$PATH"
          /usr/bin/python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/poisson-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/poisson-stage" "$PWD/port/oracle" "$RUNNER_TEMP/poisson-native"
      - name: Compare every public case exactly and run the controls on both sides
        run: |
          out="$RUNNER_TEMP/poisson-native"
          oracle="$out/oracle-build/kicad-oracle"
          nm -C "$oracle" > "$out/symbols.txt"
          for symbol in 'POISSON_DISK::ToroidalUnitTile(double, unsigned int)' 'U sincos'; do
            grep -F -- "$symbol" "$out/symbols.txt" > /dev/null || { echo "missing $symbol"; exit 1; }
          done
          rust/target/debug/kicad-difftest compare --partial --unit "$UNIT" --root "$PWD" \
            --oracle "$oracle" --rust "$PWD/rust/target/debug/kicad-poisson-shim" \
            --report "$out/compare.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print({k: r[k] for k in ("status","cases","compared","deferred","failures","unprocessed")})' "$out/compare.json"
          python3 rust/kicad-poisson-shim/compare_controls.py \
            --oracle "$oracle" --rust "$PWD/rust/target/debug/kicad-poisson-shim"
          python3 -c 'import json,sys; [print(json.dumps(json.loads(l)["request"])) for l in open(sys.argv[1])]' \
            port/oracle/fixtures/poisson-disk-controls.jsonl > "$out/control-requests.jsonl"
          cat "port/cases/$UNIT.jsonl" "$out/control-requests.jsonl" | "$oracle" > "$out/native.jsonl"
      - name: Replay the corpus and controls in import-free WebAssembly against the C++ replies
        run: |
          export KICAD_POISSON_WASM_REFERENCE="$RUNNER_TEMP/poisson-native/native.jsonl"
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-poisson-shim \
            --example corpus_parity --features live-wasm --target wasm32-unknown-unknown --release -j2
          node rust/kicad-poisson-shim/wasm-test.mjs rust/target/wasm32-unknown-unknown/release/examples/corpus_parity.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: poisson-disk-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/poisson-native/compare.json
            ${{ runner.temp }}/poisson-native/symbols.txt
            ${{ runner.temp }}/poisson-native/native.jsonl
            ${{ runner.temp }}/poisson-native/oracle-build/oracle-provenance.json
            ${{ runner.temp }}/poisson-native/oracle-build/compile_commands.json
            ${{ runner.temp }}/poisson-native/oracle-build/binary.sha256
            ${{ runner.temp }}/poisson-stage/source-manifest.json
          retention-days: 14
