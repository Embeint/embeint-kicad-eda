name: Rust dynamic R-tree live validation
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-rtree/**
      - rust/kicad-rtree-shim/**
      - port/oracle/shims/dynamic_rtree.cpp
      - port/cases/libs.kimath.include.geometry.rtree.application.pure.p001.jsonl
      - .github/workflows/rust-rtree-live.yml
permissions:
  contents: read
concurrency:
  group: rust-rtree-live-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: "2"
  RUST_TOOLCHAIN: "1.99.1"
jobs:
  rtree-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: Install bounded build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown,wasm32-wasip1
          rustup default "$RUST_TOOLCHAIN"
          python port/tools/bootstrap_west.py
      - name: Build actual pinned oracle
        env:
          ORACLE_JOBS: "2"
          GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX,-AVX2,-FMA,-FMA4,-AVX512F
          LD_LIBRARY_PATH: ""
        run: |
          export PATH="/usr/bin:/bin:$PATH"
          /usr/bin/python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/rtree-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/rtree-stage" "$PWD/port/oracle" "$HOME/kicad-port"
      - name: Compare native debug release and WASI without goldens
        env:
          GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX,-AVX2,-FMA,-FMA4,-AVX512F
          LD_LIBRARY_PATH: ""
        run: bash rust/kicad-rtree-shim/hosted_validation.sh "$HOME/kicad-port/oracle-build" "$RUNNER_TEMP/rtree-live"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rtree-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rtree-live/
            ~/kicad-port/oracle-build/oracle-provenance.json
            ~/kicad-port/oracle-build/compile_commands.json
            ~/kicad-port/oracle-build/binary.sha256
          if-no-files-found: warn
          retention-days: 14
