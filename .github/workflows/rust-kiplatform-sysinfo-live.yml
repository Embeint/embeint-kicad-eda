name: Rust kiplatform Unix drivers and sysinfo live validation

# Scoped live evidence for libs.kiplatform.os.unix.application.pure.p001 (Unix
# drivers.cpp and sysinfo.cpp): the genuine pinned oracle against the Rust shim, the
# malformed-request controls on both, and the whole corpus replayed in import-free
# wasm32 against this run's native C++ replies. The rust-port job remains the gate.
on:
  pull_request:
    branches: [rust]
    paths:
      - rust/kicad-kiplatform-sysinfo/**
      - rust/kicad-kiplatform-sysinfo-shim/**
      - rust/Cargo.toml
      - rust/Cargo.lock
      - port/oracle/**
      - port/cases/libs.kiplatform.os.unix.application.pure.p001.jsonl
      - port/units/libs.kiplatform.os.unix.application.pure.p001.toml
      - .github/workflows/rust-kiplatform-sysinfo-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiplatform-sysinfo-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      ORACLE_JOBS: "2"
      UNIT: libs.kiplatform.os.unix.application.pure.p001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # The oracle exports the pinned upstream commit, not HEAD.
      - name: Install toolchain and oracle dependencies
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.1
          # The image's packages.microsoft.com source is unused here and intermittently fails apt with 403.
          for src in /etc/apt/sources.list.d/*; do if grep -qs packages.microsoft.com "$src"; then sudo rm -f "$src"; fi; done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gcc cmake ninja-build python3 rsync git libboost-dev libwxgtk3.2-dev
      - name: Check the portable implementation and deterministic corpus
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -p kicad-kiplatform-sysinfo -p kicad-kiplatform-sysinfo-shim --check
          cargo clippy --locked --manifest-path rust/Cargo.toml -p kicad-kiplatform-sysinfo -p kicad-kiplatform-sysinfo-shim --all-targets -j2 -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml -p kicad-kiplatform-sysinfo -p kicad-kiplatform-sysinfo-shim -j2
          cargo check --locked --manifest-path rust/Cargo.toml -p kicad-kiplatform-sysinfo --target wasm32-unknown-unknown -j2
          python3 rust/kicad-kiplatform-sysinfo-shim/generate_cases.py --check
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-difftest -p kicad-kiplatform-sysinfo-shim -j2
      - name: Build the genuine pinned own-library oracle
        env:
          LD_LIBRARY_PATH: ""
        run: |
          export PATH="/usr/bin:/bin:$PATH"
          /usr/bin/python3 port/oracle/prepare.py --output-dir "$RUNNER_TEMP/sysinfo-stage"
          bash port/oracle/build.sh "$RUNNER_TEMP/sysinfo-stage" "$PWD/port/oracle" "$RUNNER_TEMP/sysinfo-native"
      - name: Compare every public case exactly and replay the controls on both sides
        run: |
          out="$RUNNER_TEMP/sysinfo-native"
          oracle="$out/oracle-build/kicad-oracle"
          # The pinned reference symbols are linked from the audited kiplatform archive.
          nm -C "$oracle" > "$out/symbols.txt"
          for symbol in 'KIPLATFORM::DRIVERS::Valid3DConnexionDriverVersion()' \
                        'KIPLATFORM::SYSINFO::SYSINFO()' 'KIPLATFORM::SYSINFO::~SYSINFO()' \
                        'KIPLATFORM::SYSINFO::GetMemoryInfo(' 'KIPLATFORM::SYSINFO::GetCPUInfo(' \
                        'KIPLATFORM::SYSINFO::GetGPUInfo('; do
            grep -F -- "$symbol" "$out/symbols.txt" > /dev/null || { echo "missing $symbol"; exit 1; }
          done
          rust/target/debug/kicad-difftest compare --partial --unit "$UNIT" --root "$PWD" \
            --oracle "$oracle" --rust "$PWD/rust/target/debug/kicad-kiplatform-sysinfo-shim" \
            --report "$out/compare.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print({k: r[k] for k in ("status","cases","compared","deferred","failures","unprocessed")})' "$out/compare.json"
          python3 port/oracle/test_kiplatform_unix_p001_inputs.py "$oracle" "$PWD/rust/target/debug/kicad-kiplatform-sysinfo-shim"
          "$oracle" < "port/cases/$UNIT.jsonl" > "$out/native.jsonl"
      - name: Replay the complete corpus in import-free WebAssembly against the C++ replies
        run: |
          export KICAD_KIPLATFORM_SYSINFO_WASM_REFERENCE="$RUNNER_TEMP/sysinfo-native/native.jsonl"
          cargo build --locked --manifest-path rust/Cargo.toml -p kicad-kiplatform-sysinfo-shim \
            --example corpus_parity --features live-wasm --target wasm32-unknown-unknown --release -j2
          node rust/kicad-kiplatform-sysinfo-shim/wasm-test.mjs rust/target/wasm32-unknown-unknown/release/examples/corpus_parity.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kiplatform-sysinfo-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sysinfo-native/compare.json
            ${{ runner.temp }}/sysinfo-native/symbols.txt
            ${{ runner.temp }}/sysinfo-native/oracle-build/oracle-provenance.json
            ${{ runner.temp }}/sysinfo-native/oracle-build/compile_commands.json
            ${{ runner.temp }}/sysinfo-native/oracle-build/binary.sha256
            ${{ runner.temp }}/sysinfo-stage/source-manifest.json
          retention-days: 14
