name: Rust MCP parity

# Roadmap gate 4: the native MCP (rust/embeint-ipc, rust/embeint-mcp) against the Python MCP it
# ports, on the same protocol fixtures (rust/parity/mcp_parity.py, without KiCad).  It also runs
# when the protocol or the ported Python code changes, so a change there that the Rust server
# does not follow fails here.  Formatting and lints for the whole workspace run in rust-layout.yml.
on:
  pull_request:
    paths:
      - "rust/**"
      - "api/proto/**"
      - "tools/live_schematic_mcp/**"
      - ".github/workflows/rust-mcp.yml"
  push:
    branches: [main, live-schematic-ipc]
    paths:
      - "rust/**"
      - "api/proto/**"
      - "tools/live_schematic_mcp/**"
      - ".github/workflows/rust-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The same pinned toolchain as rust-layout.yml
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  mcp-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/live_schematic_mcp/requirements.txt
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: rust-mcp-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Install the Python MCP and generate its protocol code
        run: |
          python -m pip install -r tools/live_schematic_mcp/requirements.txt
          python tools/live_schematic_mcp/generate_proto.py
      - name: Unit tests
        working-directory: rust
        run: cargo test --locked --release -p embeint-ipc -p embeint-mcp
      - name: Coverage regression tests
        run: python -m pytest rust/parity/test_surface_coverage.py -q
      # Builds embeint-mcp, then compares it with server.py: tool schemas, the capabilities
      # manifest, protobuf JSON and discovery rules, and every protocol fixture scenario.
      - name: Python and Rust MCP parity
        run: python rust/parity/mcp_parity.py --build --report mcp-parity-report.json
      # Missing entries remain visible during migration. --require-complete is the
      # full-surface acceptance check; it intentionally fails on the current subset.
      - name: Complete MCP surface inventory
        run: python rust/parity/surface_coverage.py --report mcp-surface-coverage.json
      - name: Keep the parity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mcp-parity-report
          path: |
            mcp-parity-report.json
            mcp-surface-coverage.json
          if-no-files-found: ignore
