notes = "All 30 owned definitions of rtree_node.h are implemented in kicad_rtree_node (HilbertXY2D, HilbertND2D, OverlapMask2D, RTREE_NODE, SLAB_ALLOCATOR with PAGE, moves and the private findOwningPage/markUsed/markUnused) for ELEMTYPE int and int64_t with a pointer-sized DATATYPE. Node and allocator identity use safe opaque handles (page token plus slot), never addresses; MemoryUsage reports the pinned Linux x86-64 reference accounting (sizeof(PAGE) and libstdc++ free-list capacity), checked against the live oracle. The first independent review's five findings are fixed: the Morton fallback refuses only INT_MIN and an executed shift of 32 or more (above 64 dimensions other orders return 0); n-dimensional masks refuse only an overlapping slot from 32 upwards; RemoveChild keeps its no-copy branch for i == count - 1 under its assert( i < count ) precondition; and moves that leave stale child pointers in live nodes are allowed and reported as destroyed. The 1498-case corpus (the original 1448 unchanged plus 50 review regressions, including a 33-slot configuration) compares exactly with zero deferrals or failures. Partial, not green, because reference branches are deliberately not reproduced: Free/Allocate of a node outside the allocator's pages (a defined reference operation: the not-found markUsed/markUnused branches and re-construction at the foreign address), other ELEMTYPE/DATATYPE instantiations (including the SSE2 signed-lane comparison of 4-byte non-int types), the NEON path, and identity after heap address reuse. Undefined-behaviour inputs (shift width, signed overflow, slots outside the arrays where accessed, double free, use after free, inactive union reads) are refused. See rust/kicad-rtree-node/README.md and the PR evidence."
