notes = "All 30 owned definitions of rtree_node.h are implemented in kicad_rtree_node (HilbertXY2D, HilbertND2D, OverlapMask2D, RTREE_NODE, SLAB_ALLOCATOR with PAGE, moves and the private findOwningPage/markUsed/markUnused) for ELEMTYPE int and int64_t with a pointer-sized DATATYPE. Pages, caller-owned external nodes and allocators live in a SlabArena that keeps page ownership, used bits, free-list entries, object lifetime and storage apart, so any allocator frees and re-allocates any constructed node exactly as the reference does: another allocator's slot, a slot PAGE() constructed but nobody allocated (reached by page_neighbour; two free lists may then name it), or external storage (never owned). Owns and findOwningPage accept null. Handles are an arena identity and never-reused page or external numbers, never addresses; MemoryUsage reports the pinned Linux x86-64 reference accounting, checked against the live oracle. All three independent reviews' findings are fixed. The 1525-case corpus (the original 1448 plus 50, 14 and 13 review regressions) compares exactly with zero deferrals or failures. Partial, not green, because reference behaviour remains deliberately unported: other ELEMTYPE/DATATYPE instantiations (including the SSE2 signed-lane comparison of 4-byte non-int types), the NEON path, and identity after heap address reuse. Undefined-behaviour inputs (shift width, signed overflow, slots outside the arrays where accessed, a second destruction, use after free, pointer arithmetic outside a page array, construction into ended storage, inactive union reads) are refused. See rust/kicad-rtree-node/README.md and the PR evidence."
