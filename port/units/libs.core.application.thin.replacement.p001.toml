notes = "All four compiled bodies of libs/core/wx_stl_compat.cpp are ported in kicad_wx_stl_compat: std::less<wxPoint>::operator() (less::less_wx_point, plus less::WxPointKey for std::map<wxPoint,T> order; compiled because the header defines USE_KICAD_WXPOINT_LESS_AND_HASH unconditionally), TowxString (to_wx_string::to_wx_string) and operator<< for wxSize and wxPoint (ostream::insert_wx_size/insert_wx_point on a byte-exact std::ostream model). Reused accepted types: kicad_map_helpers::wx_string::WxString (#78) and kicad_math::vector2wx::{WxPoint, WxSize} plus kicad_math::stream::FmtFlags (#86 and the accepted matrix stream port); no new wx types and no co-port in another unit. TowxString is wxString(const char*, size_t): ConvertStr with wxConvLibc, base wxMBConv::ToWChar chunking by NUL (every inner and trailing NUL kept, any failing chunk gives \"\"), wxMB2WC, mbsrtowcs; the C library LC_CTYPE is an explicit LibcCtype input modelling glibc's C (ASCII) and UTF-8 decoders (identical in glibc 2.39 and 2.43; wx 3.2.4 and 3.2.9 identical on these paths). The FromUTF8 model is deliberately not used. The stream model covers the sentry, setstate/clear and _M_setstate rethrow rules, width consumption and byte fill, adjustfield, bases/showbase/showpos/uppercase, numpunct grouping (ending at the first NUL byte, as the runtime's old-ABI twin facet supplies it), short writes into a bounded buffer, ios_base::failure propagation and the ~sentry unitbuf sync, which differs between the reference libstdc++ 14 runtime (SentryFlush::Unconditional, the default) and GCC 15+ (WhenGood; shim flag --sentry-flush=when-good). USE_KICAD_WXSTRING_HASH std::hash<wxString> is not compiled at the pin (macro undefined; wx 3.2 supplies std::hash<wxString>) and is not ported. No UNPORTED tags or deferrals: no owned body calls unported KiCad code. Port bounds: bounded buffer <= 2^20 bytes; unbounded buffer refuses width > 2^20; WxString MAX_UNITS. Adapter refusals (both programs): state intersecting 