notes = "All four compiled bodies of libs/core/wx_stl_compat.cpp are ported in kicad_wx_stl_compat: std::less<wxPoint>::operator() (less::less_wx_point, plus less::WxPointKey for std::map<wxPoint,T> order; compiled because the header defines USE_KICAD_WXPOINT_LESS_AND_HASH unconditionally), TowxString (to_wx_string::to_wx_string) and operator<< for wxSize and wxPoint (ostream::insert_wx_size/insert_wx_point). Reused accepted types unchanged: kicad_map_helpers::wx_string::WxString (#78), kicad_math::vector2wx::{WxPoint, WxSize} and kicad_math::stream::FmtFlags; no co-port in another unit. TowxString is wxString(const char*, size_t): ConvertStr with wxConvLibc, base wxMBConv::ToWChar chunking by NUL (every inner and trailing NUL kept, any failing chunk gives \"\"), wxMB2WC, mbsrtowcs; the C library LC_CTYPE is an explicit LibcCtype input modelling glibc's C (ASCII) and UTF-8 decoders; the FromUTF8 model is deliberately not used. The stream model OStream<H: StreamHost> takes the caller's buffer (overflow/xsputn/sync), imbued num_put::do_put(long) and tie()->flush() as fallible host operations: host exceptions propagate unchanged where _M_setstate rethrows them (badbit in the mask), partial output and width are kept, every good sentry flushes the tie, flush() is modelled for the tied stream, and the ~sentry unitbuf flush differs between the reference libstdc++ 14 runtime (SentryFlush::Unconditional, default: a throwing or failing sync with badbit in the mask terminates) and GCC 15+ (WhenGood, shim flag --sentry-flush=when-good, diagnostic). Numeric fields use fixed scratch, the grouping keeps an exact 32-byte prefix (ending at the first NUL, as the runtime's old-ABI twin numpunct supplies it), and the byte sink grows with try_reserve and throws BadAlloc. Adapters: setup's exceptions(mask) throw is caught and the insertion runs; each C++ insertion runs in a forked child whose terminate handler reports the genuine std::terminate state (no terminate refusal); an optional host object scripts throwing overflow/sync/do_put calls and a tied stream, with a call trace. USE_KICAD_WXSTRING_HASH std::hash<wxString> is not compiled in the audited configuration (macro defined nowhere at the pin; wx 3.2 supplies std::hash<wxString>) and is not ported or claimed for builds that define it. No UNPORTED tags or deferrals. Port bounds: bounded buffer <= 2^20 bytes; width > 2^20 refused for an unbounded buffer; WxString MAX_UNITS. Remaining gaps (AUDIT.md): insertion while another exception propagates, runtime bad_alloc, nested/cyclic ties, non-stock facet output, forced_unwind, other C library locales. Corpus: 4719 public fixed-seed cases (the first 3329 unchanged and first; 1390 for the terminate boundary, setup failures and host paths); 140 controls with continuations. Evidence at 6ccd4c4cde (port/oracle tree f235dbbc54): local GCC 15.2/libstdc++ 16/glibc 2.43/wx 3.2.9 4719/4719 exact with when-good, byte-identical, wasm32 import-free replay passes; same binary on the genuine Ubuntu 24.04 libstdc++6 14.2.0-4ubuntu2~24.04.1 runtime 4719/4719 exact with the default reference model (303 terminate, 138 runtime_error outcomes), first 3329 replies byte-identical to hosted run 45860674564 (original head 6f272c8188, ubuntu-24.04 GCC 13.3/libstdc++ 14.2/glibc 2.39/wx 3.2.4, 3329/3329 exact), wasm32 replay passes; 140/140 controls on both. Not target evidence for the new code: the hosted rust-wx-stl-compat-live and rust-port runs of this head are. Partial, no golden, until that and an independent review. See port/findings/wx-stl-compat-converter-and-stream-audit.md and rust/kicad-wx-stl-compat-shim/AUDIT.md."
