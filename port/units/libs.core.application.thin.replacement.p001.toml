notes = "All four compiled bodies of libs/core/wx_stl_compat.cpp are ported in kicad_wx_stl_compat: std::less<wxPoint>::operator() (less::less_wx_point, plus less::WxPointKey for std::map<wxPoint,T> order; compiled because the header defines USE_KICAD_WXPOINT_LESS_AND_HASH unconditionally), TowxString (to_wx_string::to_wx_string) and operator<< for wxSize and wxPoint (ostream::insert_wx_size/insert_wx_point). Reused accepted types unchanged: kicad_map_helpers::wx_string::WxString (#78), kicad_math::vector2wx::{WxPoint, WxSize} and kicad_math::stream::FmtFlags; no co-port in another unit. TowxString is wxString(const char*, size_t): ConvertStr with wxConvLibc, base wxMBConv::ToWChar chunking by NUL (every inner and trailing NUL kept, any failing chunk gives \"\"), wxMB2WC, mbsrtowcs; the C library LC_CTYPE is an explicit LibcCtype input modelling glibc's C (ASCII) and UTF-8 decoders; the FromUTF8 model is deliberately not used. The stream model OStream<H: StreamHost> takes the caller's buffer (overflow/xsputn/sync, or a null rdbuf: has_rdbuf, consulted by init, clear, ~sentry and flush), the imbued num_put::do_put(long) with the stream as its mutable ios_base (IosBase: flags, width, precision, numpunct; stock_do_put_long is the whole _M_insert_int<long> including __pad, for any long) and tie()->flush() as fallible host operations, a forced-unwind classification (is_forced_unwind: badbit and an unconditional rethrow) and an explicit CallContext (uncaught_exception, reaching every main and tied sentry). Host exceptions propagate unchanged where _M_setstate rethrows them (badbit in the mask), partial output and width are kept, every good sentry flushes the tie, and the ~sentry unitbuf flush differs between the reference libstdc++ 14 runtime (SentryFlush::Unconditional, default: a throwing, cancelled or failing sync with badbit in the mask terminates) and GCC 15+ (WhenGood, shim flag --sentry-flush=when-good, diagnostic; a swallowed forced unwind aborts). Numeric fields use fixed scratch, the grouping keeps an exact 32-byte prefix (ending at the first NUL, as the runtime's old-ABI twin numpunct supplies it), padded facet fields are reserved fallibly up to 2^20 bytes, and the byte sink grows with try_reserve and throws BadAlloc. Adapters: setup's exceptions(mask) throw is caught and the insertion runs; each C++ insertion runs in a forked child whose terminate and SIGABRT handlers report the genuine state (no terminate refusal); an optional host object scripts throwing overflow/sync/do_put calls, a facet that changes its ios_base before and after delegating, a tied stream, null buffers and the cancellation of the insertion's thread (pthread_cancel, a genuine forced unwind), with a call trace; unwinding: true runs the operator in a destructor while another exception propagates. USE_KICAD_WXSTRING_HASH std::hash<wxString> is not compiled in the audited configuration (macro defined nowhere at the pin; wx 3.2 supplies std::hash<wxString>) and is not ported or claimed for builds that define it. No UNPORTED tags or deferrals. Port bounds: bounded buffer <= 2^20 bytes; width > 2^20 refused for an unbounded buffer; stock padding <= 2^20; WxString MAX_UNITS; adapters refuse unwinding with cancel. Remaining gaps (AUDIT.md): runtime bad_alloc and allocation-safe failure reporting, nested/cyclic ties, facets reaching beyond ios_base (imbue, iword/pword, callbacks, basic_ios downcasts), other C library locales. Corpus: 5709 public fixed-seed cases (the first 3329 and the next 1390 unchanged and first; 990 for unwinding, facet state, forced unwinding and null buffers); 217 controls with continuations. The independent Sol review of 058165f437 found ambient unwinding, mutable facet ios state/padding, forced-unwind propagation and null-buffer behaviour missing and an allocating Clone; all five are corrected (Clone at 4aaae34988; the others in port/findings/wx-stl-compat-review-corrections.md). Local evidence of the correction (WSL GCC 15.2/glibc 2.43/wx 3.2.9, oracle built from a raw-blob export: 918 files equal to git cat-file blobs; the earlier Windows export had been CRLF-converted by core.autocrlf): genuine Ubuntu 24.04 libstdc++6 14.2.0-4ubuntu2~24.04.1 runtime 5709/5709 byte-identical with the default reference model (383 terminate, 165 forced_unwind), local libstdc++ 16 5709/5709 with when-good (38 abort), 217/217 controls on both and the shim, import-free wasm32 replays pass. Not target evidence: the hosted rust-wx-stl-compat-live (which now checks its stage against the raw blobs) and rust-port runs are. Partial, no golden, until those and a fresh independent review. See port/findings/wx-stl-compat-converter-and-stream-audit.md and rust/kicad-wx-stl-compat-shim/AUDIT.md."
