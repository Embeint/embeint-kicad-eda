notes = "Co-port record (unchanged): Minimum co-port by libs.kimath.src.geometry.ellipse.application.ui.p001 (PR #81): FLIP_DIRECTION from include/core/mirror.h as kicad_math::ellipse::FlipDirection, LeftRight and TopBottom enumerators only. A non-enumerator value, which takes the TOP_BOTTOM branch in C++, is not representable. MIRROR, MIRRORVAL, MIRROR_AXIS and every other owned body remain with this todo unit; the ellipse co-port does not claim them. This port: All 37 owned USRs ported. typeinfo.h, throttle.h, leak_at_exit.h and inplace_function.h are in kicad_core (typeinfo, throttle, leak_at_exit, inplace_function; re-exported as kicad_core::app_include_core); mirror.h is kicad_math::mirror. Co-port preserved and completed: FLIP_DIRECTION, first co-ported by libs.kimath.src.geometry.ellipse.application.ui.p001 (PR #81) as kicad_math::ellipse::FlipDirection with its two enumerators, now lives in kicad_math::mirror with its whole int domain (Other(NonEnumerator), built only by FlipDirection::from_int) and is re-exported at the ellipse path; ELLIPSE::Mirror tests only LEFT_RIGHT, so a non-enumerator takes its TOP_BOTTOM branch as in C++. THROTTLE reads steady_clock::now() through the host-supplied throttle::SteadyClock; the oracle wraps libstdc++'s steady_clock::now() with -Wl,--wrap while a case is armed. MIRRORVAL<double> follows the compiled reference form aMirrorRef - ( aPoint - aMirrorRef ) (port/findings/core-app-include-mirrorval-compiled-subtraction.md). Review corrections: INPLACE_FUNCTION stores its callable inline without allocating (stack_dst 0.8.2 with a reviewed compatibility patch, rust/vendor/stack_dst/EMBEINT-PATCH.md; separate size/alignment compile-time assertions; metadata outside the payload) and makes the callable's special members explicit (Callable: move_construct, fallible copy_construct, Drop), with fallible copies that keep the old target and explicit self-assignment branches; inplace_lifecycle cases compare every special-member event with the oracle (port/findings/core-app-include-inplace-function-storage.md). LEAK_AT_EXIT keeps its object in a never-freed heap allocation that outlives the wrapper (release), reports allocation failure and retries after a failed construction (try_get_with; flaky cases). IsA and dyn_cast (with dyn_cast_mut) are qualified through a generic fixture hierarchy with its own ClassOf predicates; production hierarchies stay with their owners (port/findings/core-app-include-isa-dyncast-owners.md). Local WSL evidence (GCC 15.2.0, glibc 2.43, rustc 1.99.1; not the qualified GCC 13 / glibc 2.39): 4,031/4,031 public cases exact against the pinned oracle, 0 deferred, 336 refusal controls equal on both sides, 336 successful same-process continuation requests after refusals; native/wasm parity on all 4,703 requests; callers libs.core.application.pure.p001 6,227/6,227 and libs.core.include.core.application.pure.p001 669/669 exact; the ellipse caller differs locally in 12 libm-dependent double cases (11 were already reported locally before this change; the 12th is reproduced by the earlier unchanged oracle binary), 100 deferred. Remains partial: hosted GCC 13 qualification and a new independent review are pending. No golden. Fresh raw-Git-blob oracle/source/linkage checks and strict-provenance Miri buffer/lifecycle probes pass; see rust/kicad-core-app-include-shim/VALIDATION.md and AUDIT.md."
