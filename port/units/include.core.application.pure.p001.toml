notes = "Co-port record (unchanged): Minimum co-port by libs.kimath.src.geometry.ellipse.application.ui.p001 (PR #81): FLIP_DIRECTION from include/core/mirror.h as kicad_math::ellipse::FlipDirection, LeftRight and TopBottom enumerators only. A non-enumerator value, which takes the TOP_BOTTOM branch in C++, is not representable. MIRROR, MIRRORVAL, MIRROR_AXIS and every other owned body remain with this todo unit; the ellipse co-port does not claim them. This port: All 37 owned USRs ported. typeinfo.h, throttle.h, leak_at_exit.h and inplace_function.h are in kicad_core (typeinfo, throttle, leak_at_exit, inplace_function; re-exported as kicad_core::app_include_core); mirror.h is kicad_math::mirror. Co-port preserved and completed: FLIP_DIRECTION, first co-ported by libs.kimath.src.geometry.ellipse.application.ui.p001 (PR #81) as kicad_math::ellipse::FlipDirection with its two enumerators, now lives in kicad_math::mirror with its whole int domain (Other(NonEnumerator), built only by FlipDirection::from_int) and is re-exported at the ellipse path; ELLIPSE::Mirror tests only LEFT_RIGHT, so a non-enumerator takes its TOP_BOTTOM branch as in C++, and the ellipse shim's replies are byte-identical before and after (2,473 requests). THROTTLE reads steady_clock::now() through the host-supplied throttle::SteadyClock; the oracle wraps libstdc++'s steady_clock::now() with -Wl,--wrap while a case is armed. MIRRORVAL<double> follows the compiled reference form aMirrorRef - ( aPoint - aMirrorRef ) (port/findings/core-app-include-mirrorval-compiled-subtraction.md). Local WSL evidence (GCC 15.2.0, glibc 2.43, rustc 1.99.1; not the qualified GCC 13 / glibc 2.39): 3,599/3,599 public cases exact against the pinned oracle, 0 deferred, 293 refusal controls equal on both sides, native/wasm parity on all 3,892 requests. Remains partial: IsA and dyn_cast have no successful-operation evidence because every real ClassOf is owned by a todo UI unit (port/findings/core-app-include-isa-dyncast-owners.md); INPLACE_FUNCTION boxes its callable because safe Rust cannot type-erase into inline storage, and LEAK_AT_EXIT's retry after a throwing T() has no counterpart (port/findings/core-app-include-inplace-function-storage.md); hosted GCC 13 qualification and separate review are pending. No golden. See rust/kicad-core-app-include-shim/AUDIT.md."
