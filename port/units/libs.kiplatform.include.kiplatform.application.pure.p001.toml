notes = "Ported in kicad_kiplatform (app, environment, io, secrets, touchpad, ui, webview modules) and, for drivers.h, sysinfo.h and sysinfo_gtk.h, in kicad_kiplatform_sysinfo. Header bodies ported exactly: io.h CLOUD_SYNC_BUFFER_SIZE, TARGET_ATTRS with its default member initializers (io::TargetAttrs), FILE_LOCK::STATE (io::FileLockState), the defaulted FILE_LOCK() with the POSIX members m_fd = -1 and m_state = NONE (io::FileLock::new), the inline MAPPED_FILE::Data() and Size() over the POSIX members (io::MappedFile::{data,size}); environment.h PROXY_CONFIG (environment::ProxyConfig, value/default init and implicit copy); touchpad.h TOUCHPAD_GESTURE, TOUCHPAD_GESTURE_HANDLER with its virtual defaulted destructor (trait object drop) and TOUCHPAD_GESTURE_CALLBACK (std::function, including bad_function_call on an empty call); ui.h NATIVE_DISPLAY_TYPE; and every default argument (AtomicRename/OpenUniqueSiblingTempFile/CommitTempFile/AtomicWriteFile aError = nullptr, StoreSecretAsync aDone = nullptr, GetNativeWindowHandles aDisplayType = nullptr) as provided trait methods that pass the default. Every other declaration is a platform function whose body is owned elsewhere, so each header's functions are a typed host trait (AppPlatform, EnvPlatform, IoPlatform, SecretsPlatform, TouchpadPlatform, UiPlatform, WebviewPlatform) with wx/OS objects as associated handle types; portable code does no OS call, I/O or GUI work. Linux bodies: os/unix/{app,environment,io,secrets}.cpp (libs.kiplatform.os.unix.application.ui.p001, todo), os/common/io.cpp (libs.kiplatform.os.common.application.ui.p001, todo), port/wxgtk/{touchpad,ui,webview}.cpp (libs.kiplatform.port.wxgtk.application.ui.p001, todo); kicad_kiplatform::owners names each. Windows/macOS-only members (MAPPED_FILE m_fileHandle/m_mapHandle, FILE_LOCK m_handle) and sysinfo_windows.h/sysinfo_osx.h are out of the Linux reference and belong to the blocked units libs.kiplatform.os.windows.application.ui.p001 and libs.kiplatform.include.kiplatform.application.ui.p001. No body of this unit calls another unit, so there are no UNPORTED tags and no deferrals. Co-ports adopted (audited against the pinned headers): GPU_INFO, CPU_INFO, MEMORY_INFO and SYSINFO (sysinfo.h, sysinfo_gtk.h) first co-ported by libs.kiplatform.os.unix.application.pure.p001 as kicad_kiplatform_sysinfo::sysinfo::{GpuInfo, CpuInfo, MemoryInfo, Sysinfo}, adopted as this unit's port with SYSINFO_BASE added (sysinfo::SysinfoBase; the Unix SYSINFO inherits it privately so keeps inherent methods) and Default as value-initialization (default-initialization of the scalar members is indeterminate and not modelled); drivers.h Valid3DConnexionDriverVersion declared and implemented as kicad_kiplatform_sysinfo::drivers::valid_3dconnexion_driver_version. Not co-ports of this unit: PBOOL (policy.h, libs.kiplatform.include.kiplatform.application.thin.replacement.p001), WxString (kicad_map_helpers) and wxPoint/wxSize (kicad_math::vector2wx), used as dependencies. Oracle: port/oracle/shims/kiplatform_include_p001.cpp includes the ten pinned headers unchanged; reference/kiplatform_include_probe.cpp compiles the pinned io.h, secrets.h and ui.h with namespace KIPLATFORM renamed and supplies recording bodies there, so the inline MAPPED_FILE accessors run on each state the pinned Unix constructor and readIntoBuffer can leave and the default arguments are observed at the callee; nm shows the probe defines no genuine KIPLATFORM symbol, and no platform body is linked. Local diagnostic evidence (own WSL tree, extracted Ubuntu g++-13 13.3.0 with local wx 3.2.9 and glibc, not the hosted GCC 13.3/wx 3.2.4 target), tree 8e92bc119f plus records, oracle sha256 38fee282d420c219a7ad751ccde45a745a7db9dea3f20cd95443694ce0f72d1a: 235 fixed-seed public cases, 235 compared exactly, 0 deferred, 0 failures, reply streams byte-identical (sha256 a2105bc0e68b243eb48ce8507cafd7fa4ef81ea900ad58a06cb10d4bf8937a40); 219 malformed-request controls refused identically by both programs, each followed by a successful request; import-free wasm32 equals the native C++ replies on every case. Status partial: no deferrals, but most header declarations only fix an interface whose behaviour is owned and tested elsewhere, no golden is supplied, and green awaits hosted live evidence and independent review."
