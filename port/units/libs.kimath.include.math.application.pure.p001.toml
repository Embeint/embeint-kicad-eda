notes = "All 24 owned definitions (20 in matrix3x3.h, 4 in wide_int.h) are implemented in kicad_math::matrix3x3 and kicad_math::wide_int. MATRIX3x3 is ported for both instantiations at the pin: double (application) and int (qa/tests/libs/kimath/math/test_matrix3x3.cpp), with scalar operators for S = double and S = int; int signed overflow and non-representable double-to-int conversions (undefined behaviour) return MatrixError, every defined input returns the C++ result. operator<< takes an explicit kicad_math::StreamState (flags, precision, width, fill; classic locale) instead of assuming a fresh stream. No dependency call is unported. Co-port: kicad_math::vector::{Vector2, Vector3} (+ Vector2D/I/L, Vector3D/I/U aliases) is the canonical minimal representation of VECTOR2/VECTOR3 from libs.kimath.include.math.application.ui.p002, which keeps ownership and stays todo: VECTOR2() as Default, VECTOR2(T,T) as Vector2::new, the VECTOR2 copy constructor as Clone/Copy, VECTOR3(T,T,T) as Vector3::new, the defaulted VECTOR3() as Default; no other vector body. Not green: valid mixed-NaN inputs mismatch the qualified oracle (port/findings/kimath-matrix-mixed-nan-payloads.md), SetRotation differs on wasm and with the glibc CPU variant (port/findings/kimath-matrix-libm-sin-cos.md and -qualified-addendum.md), and uppercase fixed stream output depends on the libstdc++ runtime (port/findings/kimath-matrix-stream-libstdcxx-lwg4084.md); each needs a reference-environment decision. The corpus retains these regressions; no golden exists. Cases, protocol and validation: rust/kicad-math-shim/README.md."
