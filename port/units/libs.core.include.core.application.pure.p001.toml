notes = "All 67 owned USRs ported in rust/kicad-core (include_core): profile.h (PROF_TIMER incl. SinceStart for eight duration types, SCOPED_PROF_TIMER, PROF_COUNTER, LATENCY_PROBE ctor/Reset/Checkpoint/AddTimer/delta_ms, wired into libs.core.application.pure.p001's to_string), observable_template (OBSERVABLE<T> Subscribe/SubscribeUnmanaged/Unsubscribe/copy ctor/Notify/NotifyIgnore incl. the catch-and-rethrow paths), union_find, filter_kruskal over a transcription of libstdc++ sort/nth_element/partition (stdalgo), minoptmax, spinlock, sync_queue, helpers (arrayDim, ignore_unused, to_underlying). Clocks are host-supplied (profile::ChronoClock); atomics, mutex and spinlock have one owner (no threads in portable code); a self-deadlocking lock() is a typed refusal. Local WSL evidence at the PR head: 669/669 cases exact against the pinned oracle (GCC 15 libstdc++), 0 deferred, 49 refusal controls on both sides; libs.core.application.pure.p001 6227/6227 exact with its 25 former delta_ms deferrals. Remain partial after hosted CI: concurrent atomic/mutex/spinlock operations and nondefault ostream state, flushing and failures are not implemented. ScopedProfTimer requires explicit finish; ordinary drop/early return does not report the duration. Profile name copies/formatting and SyncQueue::push cloning still allocate infallibly, so Allocation errors do not cover all paths and allocation-failure equivalence is unfinished. Hosted GCC 13 comparison remains required. See port/findings/core-include-review-contract-gaps.md. No golden. See rust/kicad-core-include-shim/AUDIT.md."
