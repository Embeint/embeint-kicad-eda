notes = "All five owned bodies (Compute, GetCenterPoint, GetStartAngle, GetEndAngle, GetArcAngle) are implemented in kicad_math::arc_chord_params in source order, using the canonical EdaAngle(VECTOR2D) constructor, the accepted glibc 2.39 asin/atan2 backends and the reference NaN selection (fp helpers and eda_angle div, made pub(crate)); std::clamp follows libstdc++ min(max()). No callee is unported and no UNPORTED tag exists. Co-port: the class layout, default member initializers and the 15 trivial inline accessors of arc_chord_params.h (owned by libs.kimath.include.geometry.application.pure.p001, todo) are reproduced as kicad_math::arc_chord_params::ArcChordParams and its get_*/is_valid methods, plain field reads only; that unit keeps ownership. Refused Computes keep stale members exactly as the C++ does and the corpus observes them. For 32-bit integer points the sagitta <= 0, radius <= 0 and lower-clamp branches are unreachable (a nonzero cross product of integer-valued doubles is at least 1); they are ported, not exercised. Undefined domain: GetArcAngle passes m_halfChord / m_radius to std::clamp, which C++20 [alg.clamp] does not define for NaN; the quotient is 0/0 on a default object or one whose every Compute so far was refused (port/upstream-issues/arc-chord-params-nan-clamp.md). get_arc_angle returns Err(ArcChordError::UndefinedClamp) for exactly those states and the oracle adapter reports the same refusal object without calling GetArcAngle; every other observation of such a state (0/0 quotients in the angle getters, stale and default fields) is a defined IEEE result and is still reported. The 79 requests observing such a state are the undefined-domain controls port/oracle/fixtures/arc-chord-controls.jsonl (176 Compute steps plus the default state, 96 refused observations), checked on both programs by rust/kicad-arc-chord-shim/compare_controls.py in the rust-arc-chord-live workflow; they never enter the public corpus or its counts. 1,611 fixed-seed public cases (1,959 Compute steps with defined observations only, including 78 primed- copies of the control sequences after one valid Compute) reach every other branch per generate_cases.py --branches and run live against the pinned C++ in the rust-port and rust-arc-chord-live jobs. Declared partial, not green, only because no golden exists yet; green follows a separately reviewed live propose/bless of the zero-deferral corpus."
