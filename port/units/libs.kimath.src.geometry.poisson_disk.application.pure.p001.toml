notes = "ToroidalUnitTile is implemented in kicad_math::poisson_disk statement by statement in source order; it has no unported callee and no UNPORTED tag. Callees: VECTOR2<double> fields and construction from the canonical kicad_math::vector co-port (dependency libs.kimath.include.math.application.ui.p002, partial; only plain field reads and writes are used, so no further co-port), glibc 2.39 sincos through the accepted kicad_math glibc_trig port (the pinned GCC -O3 build merges std::cos/std::sin of theta into one sincos call, checked in the compiled object), and Boost.Random 1.83 (libboost1.83-dev 1.83.0-2.1ubuntu3.2, the locked reference package) mt19937, uniform_real_distribution<double> and uniform_int_distribution<size_t>, ported faithfully in the new portable crate rust/kicad-boost-random (GPL-3.0-or-later AND BSL-1.0, recorded in port/DEPENDENCIES.md); Boost is a system dependency, not a port unit, so the co-port has no other owner. Draw order follows the compiled object: VECTOR2D p( uniform( rng ), uniform( rng ) ) is evaluated right to left (first draw is y, second is x), theta is drawn before rho, and pickIdx draws nothing for one active sample. Resource and domain contract: aMinDist <= 0 or > 0.5 returns an empty tile as upstream; NaN passes that guard and, like aMinDist below about 6.59e-10, makes the reference's (int) ceil( sqrt( 2 ) / aMinDist ) conversion undefined, refused as UndefinedGridSize before any allocation or draw. Storage is bounded by caller limits (max_grid_cells, max_samples, each at most INT_MAX), refused as GridLimit or SampleLimit with no partial result; allocations are fallible. The adapters bound both limits to 4,194,304. Evidence: genuine pinned C++ adapter port/oracle/shims/kimath_src_poisson_disk.cpp calling the reference and the pinned Boost templates directly; 499 fixed-seed public cases (empty domain, every radius from 0.5 to 0.002 including grid-size transitions at sqrt(2)/k and neighbours, exact grid limits, seed sweeps, digested tiles to ~1.5e5 samples, direct Boost draws over every uniform_int branch and the real halving/rejection paths); 57 refusal controls each followed by a successful continuation plus runtime exact-sample-limit probes (compare_controls.py); import-free wasm replay of corpus and controls in rust-poisson-live. Status partial: no deferrals, but no golden exists yet and the hosted reference and independent review are pending."
